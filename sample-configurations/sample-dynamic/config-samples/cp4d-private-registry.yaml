---
image_registry:
- name: cp4d-images
  registry_url: https://de.icr.io/cp4d-images
  registry_insecure: false

# This is just an example of installing Software Hub with a private registry. You need to add
# additional cartridges for your installation
cp4d:
- project: cpd
  openshift_cluster_name: "{{ env_id }}"
  cp4d_version: latest
  cp4d_patch_id: latest
  image_registry_name: cp4d-images
  accept_licenses: False
  cartridges:
  - name: cp-foundation
    license_service:
      state: disabled
      threads_per_core: 2
  
  - name: lite

  - name: scheduler 
    state: removed