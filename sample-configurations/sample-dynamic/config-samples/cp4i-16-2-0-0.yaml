---
cp4i:
- project: cp4i
  openshift_cluster_name: "{{ env_id }}"
  cp4i_version: 16.2.0.0
  accept_licenses: false

  instances:

  - type: platform-ui
    state: installed # installed/removed

  - type: automation-assets
    state: removed

  - type: api-connect
    state: removed
    # NOTE: make sure to set also datapower-gateway to 'installed' state (if not already installed)
    
  - type: end-to-end-monitoring
    state: removed
  
  - type: app-connect-int-dashboard
    state: removed

  - type: app-connect-int-designer
    state: removed

  - type: mq-queue-manager
    state: removed

  - type: event-streams # deprecated
    state: removed

  - type: event-endpoint-management
    state: removed

  - type: datapower-gateway
    state: removed
