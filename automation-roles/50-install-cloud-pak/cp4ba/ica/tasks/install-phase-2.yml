- name: Set ICA desktop defs list
  ansible.builtin.set_fact:
    ica_desktop_def_list: [
      {desktopId: 'CONTENT', repositoryIds: ['CONTENT'], defaultRepositoryId: 'CONTENT'},
      {desktopId: 'OS1', repositoryIds: ['OS1'], defaultRepositoryId: 'OS1'},
      {desktopId: 'OS2', repositoryIds: ['OS2'], defaultRepositoryId: 'OS2'}
    ]

- name: Add BAWTOS to ICA desktop defs list
  ansible.builtin.set_fact:
    ica_desktop_def_list: "{{ ica_desktop_def_list + [{'desktopId': 'BAWTOS', 'repositoryIds': ['BAWTOS'], 'defaultRepositoryId': 'BAWTOS'}] }}"
  when: _current_cp4ba_cluster.cp4ba.patterns.workflow.enabled and _current_cp4ba_cluster.cp4ba.patterns.workflow.optional_components.baw_authoring

- name: Configure ICA on Object Stores
  ansible.builtin.include_tasks: configure-desktop.yml
  with_items: "{{ ica_desktop_def_list }}"

- name: Set usage entry
  ansible.builtin.include_role:
    name: usage
    tasks_from: set-entry
  vars:
    usage_entry_name: IBM-Content-Assistant
    usage_entry_value: |-
      # IBM Content Assistant Client Managed Software (ICA)

      ## Endpoints

      - ICA base url (also used for CLI access): https://cas-{{ cp4ba_project_name }}.{{ apps_endpoint_domain }}
      - ICA OpenSearch user: genai-service-user / {{ ica_opensearch_password }}

      ## CLI access (CLI has to be downloaded from IBM)

      ```bash
      ibmca config url https://cas-{{ cp4ba_project_name }}.{{ apps_endpoint_domain }}
      ibmca login -u genai-service-user # password is: {{ ica_universal_password }}
      ```
