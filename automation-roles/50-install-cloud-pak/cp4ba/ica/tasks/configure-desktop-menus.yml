- name: Associate menus with desktop
  ansible.builtin.uri:
    url: "https://cpd-{{ cp4ba_project_name }}.{{ apps_endpoint_domain }}/icn/navigator/jaxrs/\
      admin/configuration?action=update&configuration=DesktopConfig&id={{ item.desktopId }}&\
      application=navigator&login_desktop=admin"
    method: POST
    return_content: true
    follow_redirects: all
    body_format: form-urlencoded
    body:
      json_post: >-
        {
          "ContentListToolbar":"GenAICompareContentListToolbar",
          "SearchResultsToolbar":"GenAICompareSearchResultsToolbar",
          "ItemContextMenu":"GenAIItemContextMenu",
          "FavoriteItemContextMenu":"GenAIFavoriteItemContextMenu"
        }
    validate_certs: false
    headers:
      Content-Type: "application/x-www-form-urlencoded"
      Connection: "keep-alive"
      Cookie: "{{ cookie_jsessionid_name }}={{ login_jsession }}"
      security_token: "{{ content.security_token }}"
      Authorization: "Bearer {{ zen_token }}"
      auth-token-realm: "InternalIamRealm"
    timeout: 60
  register: navigator_response
  failed_when: "'errors' in navigator_response.content"
