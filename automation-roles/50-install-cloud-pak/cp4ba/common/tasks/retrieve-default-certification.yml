# Example of the functionality call
# Based on https://docs.openshift.com/container-platform/4.12/security/certificates/replacing-default-ingress-certificate.html
#
# - name: Retrieve default certification
#   ansible.builtin.include_role:
#     name: common
#     tasks_from: retrieve-default-certification
#   vars:
#     common_crt_output_to_var: "tls_crt"
#     common_key_output_to_var: "tls_key"
#     common_ca_output_to_var: "ca_crt"

- name: Get IngressController
  kubernetes.core.k8s_info:
    api_version: operator.openshift.io/v1
    kind: IngressController
    namespace: openshift-ingress-operator
    name: default
  register: ingress_controller

- name: Retrieve default certificate name
  ansible.builtin.set_fact:
    default_certificate_name: "{{ ingress_controller.resources[0].spec.defaultCertificate.name
      if ingress_controller.resources[0].spec.defaultCertificate is defined else 'router-certs-default' }}"

- name: Get default certificate contents
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: openshift-ingress
    name: "{{ default_certificate_name }}"
  register: default_secret

- name: Retrieve tls.crt
  ansible.builtin.set_fact:
    encoded_cert: "{{ default_secret.resources[0].data['tls.crt'] }}"

- name: Decode base64 content
  ansible.builtin.set_fact:
    decoded_content: "{{ encoded_cert | b64decode }}"

- name: Extract only certificates
  ansible.builtin.set_fact:
    certs: "{{ decoded_content |
      regex_findall('(?s)-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----', multiline=True) }}"

- name: Re-encode certificates
  ansible.builtin.set_fact:
    "{{ common_crt_output_to_var }}": "{{ certs | join('\r\n') | b64encode }}"

- name: Retrieve tls.key
  ansible.builtin.set_fact:
    "{{ common_key_output_to_var }}": "{{ default_secret.resources[0].data['tls.key'] }}"

- name: Get Proxy
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Proxy
    name: cluster
  register: proxy

- name: Retrieve trustedCA name
  ansible.builtin.set_fact:
    trusted_ca_name: "{{ proxy.resources[0].spec.trustedCA.name | default('') }}"

- name: Get trusted CAs from OCP
  when: trusted_ca_name | length > 0
  block:

    - name: Get trusted CAs config map
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        name: "{{ trusted_ca_name }}"
        namespace: openshift-config
      register: trusted_ca

    - name: Retrieve trusted CAs
      ansible.builtin.set_fact:
        "{{ common_ca_output_to_var }}": "{{ (certs | join('\r\n') + '\r\n' + trusted_ca.resources[0].data['ca-bundle.crt']) | b64encode }}"

- name: Look up root CA from system trusted bundle when proxy has no user-defined CA
  when: trusted_ca_name | length == 0
  block:

    - name: Get root CA subject CN from the top-level cert in the chain
      ansible.builtin.set_fact:
        root_ca_subject_cn: >-
          {{ (certs | last | community.crypto.x509_certificate_info).issuer.commonName | default('') }}

    - name: Get operator-controller trusted CA bundle configmap
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        name: operator-controller-trusted-ca-bundle
        namespace: openshift-operator-controller
      register: system_trusted_ca_bundle

    - name: Extract raw ca-bundle.crt text from configmap (empty string when missing)
      ansible.builtin.set_fact:
        system_ca_bundle_raw: >-
          {{ system_trusted_ca_bundle.resources[0].data['ca-bundle.crt'] | default('') }}

    # Each entry is preceded by a comment line "# <CA NAME>" followed by the PEM block.
    # regex_findall returns a list of [name, pem] pairs.
    - name: Find PEM block whose comment label matches the root CA CN
      ansible.builtin.set_fact:
        matched_ca_pem: >-
          {{ system_ca_bundle_raw
             | regex_findall('(?m)^# (.+)\n(-----BEGIN CERTIFICATE-----(?:.|\n)*?-----END CERTIFICATE-----)')
             | selectattr(0, 'equalto', root_ca_subject_cn)
             | map(attribute=1)
             | list | first | default('') }}

    - name: Use matched public CA from system bundle as ca.crt
      ansible.builtin.set_fact:
        "{{ common_ca_output_to_var }}": "{{ (certs | join('\r\n') + '\r\n' + matched_ca_pem) | b64encode }}"
      when: matched_ca_pem | length > 0

    - name: Fall back to tls.crt as ca.crt when no match found in system bundle
      ansible.builtin.set_fact:
        "{{ common_ca_output_to_var }}": "{{ default_secret.resources[0].data['tls.crt'] }}"
      when: matched_ca_pem | length == 0
