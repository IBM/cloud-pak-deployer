- name: Set output directory variable
  ansible.builtin.set_fact:
    projects_output_directory: "{{ generic_directory }}/projects"

- name: Create Projects directory for generated files
  ansible.builtin.file:
    path: "{{ projects_output_directory }}"
    state: directory
    mode: u+rwx

- name: Create Project
  ansible.builtin.include_role:
    name: common
    tasks_from: create-project
  vars:
    common_namespace_name: "{{ main_project_name }}"
    common_output_directory: "{{ projects_output_directory }}"

- name: Create Project
  ansible.builtin.include_role:
    name: common
    tasks_from: create-project
  vars:
    common_namespace_name: "{{ collateral_project_name }}"
    common_output_directory: "{{ projects_output_directory }}"

- name: Generate usage
  ansible.builtin.include_role:
    name: usage

- name: Install Global CA
  ansible.builtin.include_role:
    name: global_ca

- name: Install PostgreSQL
  ansible.builtin.include_role:
    name: postgresql
  when: postgresql_enabled

- name: Install openldap
  ansible.builtin.include_role:
    name: openldap
  when: openldap_enabled

- name: Install gitea
  ansible.builtin.include_role:
    name: gitea
  when: gitea_enabled

- name: Install nexus
  ansible.builtin.include_role:
    name: nexus
  when: nexus_enabled

- name: Install Mail
  ansible.builtin.include_role:
    name: mail
  when: mail_enabled

- name: Install CPFS
  ansible.builtin.include_role:
    name: cpfs

- name: Install CP4BA Phase 1
  ansible.builtin.include_role:
    name: cp4ba-core
  vars:
    install_phase_1: true
  when: _current_cp4ba_cluster.cp4ba.enabled

- name: Install cloudbeaver
  ansible.builtin.include_role:
    name: cloudbeaver
  when: (postgresql_enabled or mssql_enabled) and _current_cp4ba_cluster.cloudbeaver_enabled

- name: Install Roundcube
  ansible.builtin.include_role:
    name: roundcube
  when: mail_enabled and _current_cp4ba_cluster.roundcube_enabled

- name: Install phpLDAPadmin
  ansible.builtin.include_role:
    name: phpldapadmin
  when: openldap_enabled and _current_cp4ba_cluster.phpldapadmin_enabled

- name: Install Cerebro
  ansible.builtin.include_role:
    name: cerebro
  when: _current_cp4ba_cluster.cp4ba.enabled and (_current_cp4ba_cluster.cp4ba.patterns.foundation.optional_components.bai or
    _current_cp4ba_cluster.cp4ba.patterns.workflow.enabled) and _current_cp4ba_cluster.cerebro_enabled

- name: Install OpenSearch Dashboards
  ansible.builtin.include_role:
    name: opensearch_dashboards
  when: _current_cp4ba_cluster.cp4ba.enabled and (_current_cp4ba_cluster.cp4ba.patterns.foundation.optional_components.bai or
    _current_cp4ba_cluster.cp4ba.patterns.workflow.enabled) and (_current_cp4ba_cluster.opensearch_dashboards_enabled | default(true))

- name: Install AKHQ
  ansible.builtin.include_role:
    name: akhq
  when: _current_cp4ba_cluster.cp4ba.enabled and (_current_cp4ba_cluster.cp4ba.patterns.foundation.optional_components.bai or
    _current_cp4ba_cluster.cp4ba.patterns.workflow.optional_components.kafka) and _current_cp4ba_cluster.akhq_enabled

- name: Install PM
  ansible.builtin.include_role:
    name: pm
  when: _current_cp4ba_cluster.pm.enabled

- name: Install MSSQL
  ansible.builtin.include_role:
    name: mssql
  when: mssql_enabled

- name: Install RPA Phase 1
  ansible.builtin.include_role:
    name: rpa
  vars:
    rpa_install_phase_1: true
  when: _current_cp4ba_cluster.rpa.enabled

- name: Install BAMOE
  ansible.builtin.include_role:
    name: bamoe
  when: _current_cp4ba_cluster.bamoe.enabled

- name: Install OpenSearch
  ansible.builtin.include_role:
    name: opensearch
  when: opensearch_enabled

- name: Install ICA
  ansible.builtin.include_role:
    name: ica
  when: _current_cp4ba_cluster.ica.enabled

- name: Install CP4BA Phase 2
  ansible.builtin.include_role:
    name: cp4ba-core
  vars:
    install_phase_2: true
  when: _current_cp4ba_cluster.cp4ba.enabled

- name: Install RPA Phase 2
  ansible.builtin.include_role:
    name: rpa
  vars:
    rpa_install_phase_2: true
  when: _current_cp4ba_cluster.rpa.enabled
