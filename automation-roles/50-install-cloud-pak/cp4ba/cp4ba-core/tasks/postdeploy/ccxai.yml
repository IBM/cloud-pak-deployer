- name: Get OCP Apps domain
  ansible.builtin.include_role:
    name: common
    tasks_from: apps-endpoint
  vars:
    common_output_to_var: "apps_endpoint_domain"

## Based on https://www.ibm.com/docs/en/cloud-paks/cp-biz-automation/26.0.0?topic=ccas-configuring-content-cortex-ai-services-support-external-mcp-clients
- name: Prepare yaml file for CCX AI CM
  ansible.builtin.template:
    src: ccxai/ccxai-configmap.yaml.j2
    dest: "{{ cp4ba_output_directory }}/ccxai-configmap.yaml"
    mode: u+rwx

- name: Add CCX AI CM
  kubernetes.core.k8s:
    state: present
    src: "{{ cp4ba_output_directory }}/ccxai-configmap.yaml"

- name: Patch ibm-ai-services-integration-config ConfigMap
  kubernetes.core.k8s:
    api_version: v1
    kind: ConfigMap
    name: ibm-ai-services-integration-config
    namespace: "{{ cp4ba_project_name }}"
    definition:
      data:
        oidc_client_secret: "mcp-oauth-client-secret"
    merge_type: merge

- name: Patch CCXAIServices ai-services custom configmap
  kubernetes.core.k8s:
    api_version: ccxaiservices.operator.ibm.com/v1
    kind: CCXAIServices
    name: ai-services
    namespace: "{{ cp4ba_project_name }}"
    definition:
      spec:
        core_mcp_server_configuration:
          custom_configmap:
            - name: "core-mcp-override-custom-configmap"
              is_env: true
    merge_type: merge

- name: Get CCXAI MCP Pods
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ cp4ba_project_name }}"
    label_selectors:
      - "app.kubernetes.io/name=ibm-core-mcp-server-deploy"
  register: pods
  retries: 40
  delay: 15

- name: Delete CCXAI MCP pods
  kubernetes.core.k8s:
    api_version: v1
    kind: Pod
    state: absent
    namespace: "{{ cp4ba_project_name }}"
    name: "{{ item.metadata.name }}"
  loop: "{{ pods.resources }}"

- name: Wait for CCXAI MCP Deployment Available State
  ansible.builtin.include_role:
    name: common
    tasks_from: wait-resource-condition
  vars:
    common_api_version: v1
    common_resource_kind: Deployment
    common_resource_name: ibm-core-mcp-server-deploy
    common_resource_namespace: "{{ cp4ba_project_name }}"
    common_condition_name: Available
    common_retries: 80
    common_delay: 15
