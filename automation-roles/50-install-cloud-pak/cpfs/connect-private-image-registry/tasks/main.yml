---
- name: Validate mandatory variables are defined
  assert:
    that:
      - (_p_current_cp4d_cluster.image_registry_name | default("")) != ""

- name: Retrieve image registry details
  set_fact:
    current_image_registry: "{{ all_config.image_registry | json_query(_registry_query) | first | default({}) }}"
  vars:
    _registry_query: >-
      [?name=='{{ _p_current_cp4d_cluster.image_registry_name }}']

- name: Fail if the registry details for the image registry have not been found
  fail:
    msg: "Image registry details for image_registry_name {{ _p_current_cp4d_cluster.image_registry_name }} not found."
  when: 
  - current_image_registry | default({}) == {}

- name: Show current image registry
  debug:
    var: current_image_registry

# Connect to IBM Container registry if on IBM Cloud
- include_tasks: ibmcloud-cr-connect.yml
  when: cloud_platform == 'ibm-cloud'

- name: Get private registry authentication details
  include_role: 
    name: vault-get-secret
  vars:
    secret_name: "image-registry-{{ _p_current_cp4d_cluster.image_registry_name }}"
    secret_group: "{{ environment_name }}"
    _p_secret_variable: private_registry_auth

- name: Fail if the credentials for the image registry have not been found in the vault
  fail:
    msg: "Vault secret image-registry-{{ _p_current_cp4d_cluster.image_registry_name }} not found; this must exist for image registry {{ _p_current_cp4d_cluster.image_registry_name }}"
  when: private_registry_auth == ""

- name: Fail if the credentials are not in the correct format of "user:password"
  fail:
    msg: "Private registry credentials in vault secret image-registry-{{ _p_current_cp4d_cluster.image_registry_name }} must in the format of user:password"
  when: not (private_registry_auth is search(':'))

- name: Split registry_url into hostname, port and namespace if URL specified
  vars:
    # Strip scheme (http:// or https://) then split on the first /
    _no_scheme: "{{ current_image_registry.registry_url | regex_replace('^https?://', '') }}"
    _host_part: "{{ _no_scheme.split('/')[0] }}"
    _namespace: "{{ _no_scheme.split('/', 1)[1] | default('') }}"
    _hostname: "{{ _host_part.split(':')[0] }}"
    _port: "{{ _host_part.split(':')[1] | default('') }}"
  set_fact:
    _registry_hostname: "{{ _hostname }}"
    _registry_port: "{{ _port }}"
    _registry_namespace: "{{ _namespace }}"
  when: (current_image_registry.registry_url | default('')) != ''

- name: Set registry host name, port and namespace if separate attributes were set
  set_fact:
    _registry_hostname: "{{ current_image_registry.registry_hostname }}"
    _registry_port: "{{ current_image_registry.registry_port | default('') }}"
    _registry_namespace: "{{ current_image_registry.registry_namespace | default('') }}"
  when: (current_image_registry.registry_url | default('')) == ''

- set_fact:
    private_registry_url: "{{ lookup('template','get_private_registry.j2') }}"
    private_registry_url_namespace: "{{ lookup('template','get_private_registry_with_namespace.j2') }}"

- name: Try to login to the specified registry at {{ private_registry_url }}
  shell: |
    skopeo login {{ private_registry_url }} \
      --username "{{ private_registry_auth.split(':')[0] }}" \
      --password "{{ private_registry_auth.split(':')[1] }}" \
      --tls-verify=false