---
# =============================================================================
# wait-for-ready.yml
# bobctl install and bobctl upgrade return as soon as helm has applied the chart, so the
# deployer polls the operator deployment and the Bob CR itself.
#
# After an upgrade (_upgrade_bob) the CR stays Available during the upgrade, so Available says
# nothing about the new version. Observed on a live 2.0.0 to 2.0.1 upgrade: the Available
# condition has no observedGeneration, Progressing keeps an old observedGeneration, and only
# Degraded carries the current one. The wait therefore requires that spec.version is the
# requested version and that Degraded is present, False and (when it has an observedGeneration)
# observed at the current metadata.generation.
# =============================================================================

- name: Log the wait for IBM Bob to be ready (dry run)
  include_role:
    name: log-deployer-activity
  vars:
    _p_activity_description: "Wait for IBM Bob {{ _ibm_bob_version }} to be ready in namespace {{ current_ibm_bob_cluster.project }}"
    _p_activity_comment: >-
      Wait until deployment ibm-bob-operator in namespace {{ current_ibm_bob_cluster.operators_project | default('ibm-bob-operators') }}
      is available and the Bob custom resource bob-cr in namespace {{ current_ibm_bob_cluster.project }} reports Available
      {{- ' for version ' ~ _ibm_bob_version ~ ' and Degraded=False for the current generation' if (_upgrade_bob | default(false) | bool) else '' }}
  when: cpd_dry_run | default(false) | bool

- name: "Wait for the IBM Bob operator deployment in {{ current_ibm_bob_cluster.operators_project | default('ibm-bob-operators') }} to be available"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: ibm-bob-operator
    namespace: "{{ current_ibm_bob_cluster.operators_project | default('ibm-bob-operators') }}"
  register: _ibm_bob_operator_deployment
  until:
    - _ibm_bob_operator_deployment.resources | default([]) | length > 0
    - (_ibm_bob_operator_deployment.resources[0].status.availableReplicas | default(0)) >= 1
  retries: 30
  delay: 20
  when: not cpd_dry_run

- name: "Wait for the Bob custom resource bob-cr in {{ current_ibm_bob_cluster.project }} to report Available"
  kubernetes.core.k8s_info:
    api_version: bob.ibm.com/v1beta1
    kind: Bob
    name: bob-cr
    namespace: "{{ current_ibm_bob_cluster.project }}"
  register: _ibm_bob_cr
  until: >-
    (_ibm_bob_cr.resources | default([]) | length) > 0 and
    ((_ibm_bob_cr.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Available')
      | selectattr('status', 'equalto', 'True') | list | length) > 0) and
    (not (_upgrade_bob | default(false) | bool) or (
      (_ibm_bob_cr.resources[0].spec.version | default('') | string) == _ibm_bob_version and
      ((_ibm_bob_cr.resources[0].status.conditions | default([])
        | selectattr('type', 'equalto', 'Degraded')
        | selectattr('status', 'equalto', 'False') | list | length) == 1) and
      ((_ibm_bob_cr.resources[0].status.conditions | default([])
        | selectattr('type', 'equalto', 'Degraded')
        | selectattr('observedGeneration', 'defined')
        | rejectattr('observedGeneration', 'equalto', _ibm_bob_cr.resources[0].metadata.generation)
        | list | length) == 0)))
  retries: 90
  delay: 30
  vars:
    ansible_callback_diy_runner_retry_msg: >-
      {%- set result = ansible_callback_diy.result.output -%}
      {%- set retries_left = result.retries - result.attempts -%}
      Retrying: {{ ansible_callback_diy.task.name }} ({{ retries_left }} Retries left) ...
  when: not cpd_dry_run

- name: Show Bob custom resource conditions
  debug:
    msg: "{{ _ibm_bob_cr.resources[0].status.conditions | default([]) | map(attribute='type') | zip(_ibm_bob_cr.resources[0].status.conditions | default([]) | map(attribute='status')) | list }}"
  when: not cpd_dry_run
