---
# =============================================================================
# ibm-bob-cluster: Installs IBM Bob on OpenShift cluster
# =============================================================================

- name: ///// Handling IBM Bob instance {{ current_ibm_bob_cluster.project }} /////
  debug:
    msg: "Begin processing IBM Bob instance {{ current_ibm_bob_cluster.project }}"

# 1. License acceptance verification (skipped for state=removed)
- name: Verify license acceptance
  block:
    - set_fact:
        _cpd_accept_licenses: false

    - set_fact:
        _cpd_accept_licenses: true
      when: (cpd_accept_licenses | default(false) | bool) or (current_ibm_bob_cluster.accept_licenses | default(false) | bool)

    - name: Fail if license is not accepted
      fail:
        msg: "You must accept the licenses, either in the ibm_bob object with accept_licenses: true, or by specifying --accept-all-licenses at the command line."
      when: not _cpd_accept_licenses
  when: (current_ibm_bob_cluster.state | default('installed')) != 'removed'

# 2. Set a convenience fact for the requested state
- name: Set _ibm_bob_state fact
  set_fact:
    _ibm_bob_state: "{{ current_ibm_bob_cluster.state | default('installed') }}"

# 3. Resolve variables and release bundle
- name: Resolve IBM Bob variables and download release bundle
  include_role:
    name: ibm-bob-variables

# 4. Resolve OpenShift cluster and login
- name: Get OpenShift cluster configuration
  include_role:
    name: get-openshift-cluster
  vars:
    _p_openshift_cluster_name: "{{ current_ibm_bob_cluster.openshift_cluster_name }}"

- name: Login to the OpenShift cluster
  include_role:
    name: openshift-login
  vars:
    _p_openshift_cluster_name: "{{ current_ibm_bob_cluster.openshift_cluster_name }}"

# 5. Branch: state=removed → uninstall then end_role; state=installed → continue
- name: Uninstall IBM Bob instance {{ current_ibm_bob_cluster.project }} (state=removed)
  block:
    - name: Fail if destroy was not confirmed
      fail:
        msg: >-
          Destroy of IBM Bob instance {{ current_ibm_bob_cluster.project }} was not confirmed
          with --confirm-destroy parameter or via global_config confirm_destroy property.
      when:
        - not (_confirm_destroy | bool)
        - not (cpd_dry_run | default(false) | bool)

    - name: Ensure log directory exists for uninstall
      file:
        path: "{{ status_dir }}/log/ibm-bob"
        state: directory
        mode: '0755'

    - name: Run IBM Bob uninstall tasks
      include_tasks: uninstall-bob.yml
      when: not (cpd_skip_cp_install | default(false) | bool)

    - name: Log that uninstall was skipped (cpd_skip_cp_install)
      debug:
        msg: "cpd_skip_cp_install is set — skipping cluster changes for removal of {{ current_ibm_bob_cluster.project }}."
      when: cpd_skip_cp_install | default(false) | bool

    - meta: end_role
  when: _ibm_bob_state == 'removed'

# 6. Check prerequisites (OCP version, storage classes, amd64 nodes, cert-manager)
# Must run before config.yaml is rendered: it resolves ocp_storage_class_file/block.
- name: Validate prerequisites for IBM Bob
  include_tasks: validate-prereqs.yml

# 6a. Decide between install, re-apply and upgrade (reads the cluster only, so it also runs in dry-run)
- name: Determine whether IBM Bob must be installed, re-applied or upgraded
  include_tasks: check-bob-upgrade.yml
  when: not (cpd_skip_cp_install | default(false) | bool)

# 6b. Prepare instance status and log directories
- name: Ensure instance working and log directories exist
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ status_dir }}/ibm-bob/{{ current_ibm_bob_cluster.project }}"
    - "{{ status_dir }}/ibm-bob/{{ current_ibm_bob_cluster.project }}/work"
    - "{{ status_dir }}/log/ibm-bob"

# 6c. Cluster base domain for bob.externalDomain. helm upgrade and helm install detect it with a
# lookup of the cluster Ingress object, but bobctl update-model-config uses helm template, which
# cannot look anything up and fails when bob.externalDomain is not in config.yaml. The value is the
# one the chart detects itself (spec.domain of ingresses.config.openshift.io/cluster). Read-only,
# so it also runs in dry run.
- name: Get the cluster Ingress configuration
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Ingress
    name: cluster
  register: _ibm_bob_cluster_ingress

- name: Set the cluster base domain
  set_fact:
    _ibm_bob_external_domain: >-
      {{ ((_ibm_bob_cluster_ingress.resources | default([])) | first | default({})).spec.domain | default('') }}

# 7. Render full config.yaml (overwrites the minimal stub written by ibm-bob-variables)
# _ibm_bob_image_pull_prefix is already set correctly by ibm-bob-variables (step 3).
- name: Render config.yaml for IBM Bob instance {{ current_ibm_bob_cluster.project }}
  template:
    src: config.yaml.j2
    dest: "{{ status_dir }}/ibm-bob/{{ current_ibm_bob_cluster.project }}/config.yaml"
    mode: '0600'

- name: Display rendered config.yaml location
  debug:
    msg: "Rendered IBM Bob config at {{ status_dir }}/ibm-bob/{{ current_ibm_bob_cluster.project }}/config.yaml"

# 8. Dry-run handling
# In dry run the steps below still run: every task that changes the cluster or runs a tool goes
# through run-command (or is guarded with cpd_dry_run), which writes the planned commands and YAML
# to {{ status_dir }}/log/deployer-activities.log without executing them.
- name: Show dry-run notification
  debug:
    msg: >-
      cpd_dry_run is set to true. No changes are made to the cluster; the commands that would be run are
      written to {{ status_dir }}/log/deployer-activities.log.
  when: cpd_dry_run | default(false) | bool

# 9. Air-gapped pre-install: create pull secrets and verify images
- name: Perform air-gapped pre-install steps (pull secrets and image verification)
  include_tasks: airgap-apply.yml
  when:
    - cpd_airgap | default(false) | bool
    - (current_ibm_bob_cluster.image_registry_name | default('')) != ''

# 10. Install GPU and OpenShift AI operators when openshift_ai_models is configured
- name: Install GPU and OpenShift AI prerequisites for openshift_ai_models
  include_role:
    name: openshift-ai-gpu-prereqs
  vars:
    _p_openshift_cluster_name: "{{ current_ibm_bob_cluster.openshift_cluster_name }}"
    _p_nfd_gpu_required: true
    _p_openshift_ai_required: true
    _p_fail_if_not_auto: true
  when:
    - current_ibm_bob_cluster.openshift_ai_models is defined
    - not (cpd_skip_cp_install | default(false) | bool)

# 11. Validate OpenShift AI prerequisites (DataScienceCluster, KServe CRD, GPU capacity)
# Runs after openshift-ai-gpu-prereqs so the operators are already installed.
- name: Validate OpenShift AI prerequisites for IBM Bob
  include_tasks: validate-openshift-ai-prereqs.yml
  when:
    - current_ibm_bob_cluster.openshift_ai_models is defined
    - not (cpd_skip_cp_install | default(false) | bool)

# 12. Deploy model PVCs, download Jobs, ServingRuntimes and InferenceServices
- name: Deploy OpenShift AI models for IBM Bob {{ current_ibm_bob_cluster.project }}
  include_role:
    name: ibm-bob-openshift-ai-models
  when:
    - current_ibm_bob_cluster.openshift_ai_models is defined
    - not (cpd_skip_cp_install | default(false) | bool)

# 13. Install IBM Bob
- name: Install IBM Bob {{ _ibm_bob_version }} in namespace {{ current_ibm_bob_cluster.project }}
  include_tasks: install-bob.yml
  when: not (cpd_skip_cp_install | default(false) | bool)

# 14. Wait for IBM Bob to be Ready
- name: Wait for IBM Bob to be Ready in namespace {{ current_ibm_bob_cluster.project }}
  include_tasks: wait-for-ready.yml
  when: not (cpd_skip_cp_install | default(false) | bool)

# 15. Provision a TLS certificate for Bob routes via cert-manager (ingress_cert mode).
# No-op when ingress_cert is not configured (self-signed). Must run after Bob is Ready
# so the routes exist for the HTTP-01 challenge and bobctl setup-route can be called.
- name: Provision ingress certificate for IBM Bob routes in namespace {{ current_ibm_bob_cluster.project }}
  include_tasks: setup-cluster-ingress-cert.yml
  when: not (cpd_skip_cp_install | default(false) | bool)
