---
# Resolve one model gateway secret from the vault and add it to _ibm_bob_model_gateway_secrets.
# Loop variable: _mg_secret (key = env var name, value = vault secret name)
- name: "Get vault secret for model gateway variable {{ _mg_secret.key }}"
  include_role:
    name: vault-get-secret
  vars:
    secret_name: "{{ _mg_secret.value }}"
    secret_group: "{{ environment_name }}"

- name: "Fail if vault secret for {{ _mg_secret.key }} is empty"
  fail:
    msg: "Vault secret '{{ _mg_secret.value }}' (model gateway variable {{ _mg_secret.key }}) is empty or not set in group '{{ environment_name }}'."
  when: (secret_value | default('')) == ''

- name: "Add {{ _mg_secret.key }} to model gateway secrets"
  set_fact:
    _ibm_bob_model_gateway_secrets: "{{ _ibm_bob_model_gateway_secrets | combine({_mg_secret.key: secret_value}) }}"
  no_log: true
