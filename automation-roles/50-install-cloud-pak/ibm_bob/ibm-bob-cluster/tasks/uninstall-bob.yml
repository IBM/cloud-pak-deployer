---
# =============================================================================
# uninstall-bob.yml
# Removes an IBM Bob installation created by install-bob.yml.
#
# Docs: https://bob.ibm.com/docs/ide/enterprise/on-premises/installation/uninstall
#
# Sequence (from the uninstall docs):
#   1. Delete the Bob CR and BobIdp CR without waiting (--wait=false); the
#      operator finalizer will block namespace deletion until they are gone.
#   2. Patch out the BobIdp finalizer so the CR can actually be deleted.
#   3. helm uninstall ibm-bob (removes the operator and all workloads).
#   4. Wait for both namespaces to be fully terminated.
#   5. Delete the cluster-scoped resources that were applied during install
#      (ibm-bob-cluster-scoped CRDs, ClusterRole, etc.) if the work file exists.
#   6. Remove the Keycloak admin vault key.
#
# Every step is idempotent: a resource that is already absent is not an error.
# cpd_skip_cp_install: when true, log that uninstall is skipped (dry-run guard
#   already handled upstream; this flag is respected here for symmetry).
# =============================================================================

# ---- Step 1: trigger CR deletion (--wait=false, async) ---------------------
- name: Delete Bob CR in namespace {{ current_ibm_bob_cluster.project }} (async)
  kubernetes.core.k8s:
    state: absent
    api_version: bob.ibm.com/v1beta1
    kind: Bob
    name: bob-cr
    namespace: "{{ current_ibm_bob_cluster.project }}"
    wait: false
  ignore_errors: true

- name: Check if BobIdp CRD exists
  command: oc get crd bobidps.bob.ibm.com
  register: _ibm_bob_idp_crd_check
  changed_when: false
  failed_when: false

- name: Delete BobIdp CR in namespace {{ current_ibm_bob_cluster.project }} (async)
  kubernetes.core.k8s:
    state: absent
    api_version: bob.ibm.com/v1beta1
    kind: BobIdp
    name: bob-idp
    namespace: "{{ current_ibm_bob_cluster.project }}"
    wait: false
  ignore_errors: true
  when: _ibm_bob_idp_crd_check.rc == 0

# ---- Step 2: patch out the BobIdp finalizer so deletion can proceed --------
- name: Check if BobIdp CR still exists
  kubernetes.core.k8s_info:
    api_version: bob.ibm.com/v1beta1
    kind: BobIdp
    name: bob-idp
    namespace: "{{ current_ibm_bob_cluster.project }}"
  register: _ibm_bob_idp_cr
  when: _ibm_bob_idp_crd_check.rc == 0

- name: Patch out BobIdp finalizer to unblock deletion
  kubernetes.core.k8s:
    state: patched
    api_version: bob.ibm.com/v1beta1
    kind: BobIdp
    name: bob-idp
    namespace: "{{ current_ibm_bob_cluster.project }}"
    definition:
      metadata:
        finalizers: []
  when:
    - _ibm_bob_idp_crd_check.rc == 0
    - (_ibm_bob_idp_cr.resources | default([])) | length > 0
  ignore_errors: true

# ---- Step 3: helm uninstall -------------------------------------------------
- name: Check if helm release ibm-bob exists in {{ current_ibm_bob_cluster.project }}
  command: >-
    helm status ibm-bob --namespace {{ current_ibm_bob_cluster.project }}
  register: _ibm_bob_helm_status
  changed_when: false
  failed_when: false
  environment: "{{ _ibm_bob_bobctl_env }}"

- name: Uninstall helm release ibm-bob in {{ current_ibm_bob_cluster.project }}
  include_role:
    name: run-command
  vars:
    _p_command_description: "Uninstall IBM Bob helm release in namespace {{ current_ibm_bob_cluster.project }}"
    _p_command: >-
      helm uninstall ibm-bob --namespace {{ current_ibm_bob_cluster.project }} --wait
    _p_command_environment: "{{ _ibm_bob_bobctl_env }}"
    _p_command_log_file: "{{ status_dir }}/log/ibm-bob/{{ current_ibm_bob_cluster.project }}-uninstall.log"
  when: _ibm_bob_helm_status.rc == 0

# ---- Step 4: delete the namespaces ------------------------------------------
- name: Delete instance namespace {{ current_ibm_bob_cluster.project }}
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ current_ibm_bob_cluster.project }}"
    wait: true
    wait_timeout: 300
  ignore_errors: true

- name: Delete operator namespace {{ current_ibm_bob_cluster.operators_project | default('ibm-bob-operators') }}
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ current_ibm_bob_cluster.operators_project | default('ibm-bob-operators') }}"
    wait: true
    wait_timeout: 300
  ignore_errors: true

# ---- Step 4b: remove OpenShift AI model objects (if openshift_ai_models was configured) ----
# By default (remove_model_weights: true) the PVCs and the models namespace are deleted too.
# Set remove_model_weights: false to keep the downloaded weights, which are expensive to re-download.
- name: Remove InferenceService objects created by the deployer (openshift_ai_models)
  kubernetes.core.k8s:
    state: absent
    api_version: serving.kserve.io/v1beta1
    kind: InferenceService
    name: "{{ item }}"
    namespace: "{{ current_ibm_bob_cluster.openshift_ai_models.project
                   | default(current_ibm_bob_cluster.project + '-models') }}"
    wait: false
  loop:
    - ibm-bob-core-model
    - ibm-bob-guardrail-model
  ignore_errors: true
  when: current_ibm_bob_cluster.openshift_ai_models is defined

- name: Remove ServingRuntime objects created by the deployer (openshift_ai_models)
  kubernetes.core.k8s:
    state: absent
    api_version: serving.kserve.io/v1alpha1
    kind: ServingRuntime
    name: "{{ item }}"
    namespace: "{{ current_ibm_bob_cluster.openshift_ai_models.project
                   | default(current_ibm_bob_cluster.project + '-models') }}"
    wait: false
  loop:
    - ibm-bob-core-vllm
    - ibm-bob-guardrail-vllm
  ignore_errors: true
  when: current_ibm_bob_cluster.openshift_ai_models is defined

- name: Note that PVCs in models namespace are kept after removal
  debug:
    msg: >-
      The model weights PVCs in namespace
      '{{ current_ibm_bob_cluster.openshift_ai_models.project
          | default(current_ibm_bob_cluster.project + '-models') }}'
      are kept. Delete them manually if you no longer need the downloaded weights:
        oc delete pvc ibm-bob-core-model ibm-bob-guardrail-model -n <models-namespace>
      remove_model_weights is set to false in the ibm_bob config. Remove that setting (default is true) to delete them automatically.
  when:
    - current_ibm_bob_cluster.openshift_ai_models is defined
    - not (current_ibm_bob_cluster.remove_model_weights | default(true) | bool)

- name: Delete model weight PVCs (when remove_model_weights is true)
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: PersistentVolumeClaim
    name: "{{ item }}"
    namespace: "{{ current_ibm_bob_cluster.openshift_ai_models.project
                   | default(current_ibm_bob_cluster.project + '-models') }}"
    wait: true
    wait_timeout: 300
  loop:
    - ibm-bob-core-model
    - ibm-bob-guardrail-model
  ignore_errors: true
  when:
    - current_ibm_bob_cluster.openshift_ai_models is defined
    - current_ibm_bob_cluster.remove_model_weights | default(true) | bool

- name: Delete models namespace (when remove_model_weights is true)
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ current_ibm_bob_cluster.openshift_ai_models.project
               | default(current_ibm_bob_cluster.project + '-models') }}"
    wait: false
  ignore_errors: true
  when:
    - current_ibm_bob_cluster.openshift_ai_models is defined
    - current_ibm_bob_cluster.remove_model_weights | default(true) | bool

- name: Wait for models namespace to be fully terminated
  shell: >-
    oc get namespace
    {{ current_ibm_bob_cluster.openshift_ai_models.project
       | default(current_ibm_bob_cluster.project + '-models') }}
    --no-headers 2>/dev/null | wc -l
  register: _ibm_bob_models_ns_wait
  retries: 30
  delay: 10
  until: _ibm_bob_models_ns_wait.stdout | trim == '0'
  changed_when: false
  failed_when: false
  when:
    - current_ibm_bob_cluster.openshift_ai_models is defined
    - current_ibm_bob_cluster.remove_model_weights | default(true) | bool

# ---- Step 4c: remove cert-manager Certificate and Issuer (if deployer-managed) ----
- name: Delete Certificate bob-cluster-ingress-tls (deployer-managed)
  kubernetes.core.k8s:
    state: absent
    api_version: cert-manager.io/v1
    kind: Certificate
    name: bob-cluster-ingress-tls
    namespace: "{{ current_ibm_bob_cluster.project }}"
  ignore_errors: true
  when: (current_ibm_bob_cluster.ingress_cert | default({})) != {}

- name: Delete deployer-managed Issuer ibm-bob-acme
  kubernetes.core.k8s:
    state: absent
    api_version: cert-manager.io/v1
    kind: Issuer
    name: ibm-bob-acme
    namespace: "{{ current_ibm_bob_cluster.project }}"
  ignore_errors: true
  when: (current_ibm_bob_cluster.ingress_cert.acme_email | default('')) != ''

# ---- Step 5: remove cluster-scoped resources --------------------------------
- name: Check if cluster-resources.yaml exists in the status dir
  stat:
    path: "{{ status_dir }}/ibm-bob/{{ current_ibm_bob_cluster.project }}/work/cluster-resources.yaml"
  register: _ibm_bob_cluster_resources_stat

- name: Delete IBM Bob cluster-scoped resources (CRDs, ClusterRole, etc.)
  include_role:
    name: run-command
  vars:
    _p_command_description: "Delete IBM Bob cluster-scoped resources"
    _p_command: >-
      oc delete -f {{ status_dir }}/ibm-bob/{{ current_ibm_bob_cluster.project }}/work/cluster-resources.yaml
      --ignore-not-found
    _p_command_environment: "{{ _ibm_bob_bobctl_env }}"
    _p_command_log_file: "{{ status_dir }}/log/ibm-bob/{{ current_ibm_bob_cluster.project }}-delete-cluster-resources.log"
  when: _ibm_bob_cluster_resources_stat.stat.exists

# ---- Step 6: remove vault keys ----------------------------------------------
- name: Remove Keycloak admin vault key for {{ current_ibm_bob_cluster.project }}
  include_role:
    name: vault-delete-secret
  vars:
    secret_name: "ibm_bob_keycloak_admin_{{ current_ibm_bob_cluster.project | replace('-','_') }}_{{ current_ibm_bob_cluster.openshift_cluster_name | replace('-','_') }}"
    secret_group: "{{ environment_name }}"
  ignore_errors: true

- name: IBM Bob instance {{ current_ibm_bob_cluster.project }} has been removed
  debug:
    msg: >-
      IBM Bob instance '{{ current_ibm_bob_cluster.project }}' has been removed from cluster
      '{{ current_ibm_bob_cluster.openshift_cluster_name }}'.
