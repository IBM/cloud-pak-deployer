# IBM Bob 2.0.1: OpenShift versions supported. The Bob documentation (System requirements)
# lists 4.20 to 4.22 and has no separate entry for 2.0.1, and the 2.0.1 release notes announce
# no change, so the 2.0.0 list applies. Update this file when the documentation says otherwise.
# The file is optional: for a version without one the OpenShift version check is skipped and
# a warning is shown.
_ibm_bob_supported_ocp_versions:
  - "4.20"
  - "4.21"
  - "4.22"
