# Instructions for adding a new IBM Bob version:
# 1. Create a new file vars/versions/<version>.yml (e.g. 2.1.0.yml).
# 2. Look up the release asset on GitHub:
#    GET https://api.github.com/repos/IBM/ibm-bob/releases/tags/v<version>
# 3. Fill in:
#    - release_tag: e.g. "v2.0.0"
#    - bundle_filename: from asset name, e.g. "ibm-bob-install-20260924-163534.tgz"
#    - bundle_url: from asset browser_download_url
#    - bundle_sha256: from asset digest (or sha256 checksum)
#    - supported_ocp_versions: list of supported OpenShift minor versions, e.g. ["4.20", "4.21", "4.22"]
#    - companion_versions: verified companion tool versions (IDE, Shell, Z package)
#    - premium_packages: dictionary of supported premium package keys
# -----------------------------------------------------------------------------

