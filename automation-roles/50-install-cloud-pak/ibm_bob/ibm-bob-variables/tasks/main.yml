---
# =============================================================================
# ibm-bob-variables: Resolves IBM Bob version, validates required tools,
# downloads/verifies/caches the release bundle, and resolves bobctl path.
# =============================================================================

# 1. Resolve requested version ('latest' is resolved from GitHub, or from the downloaded bundles in air-gapped mode)
- name: Resolve IBM Bob version
  include_tasks: resolve-version.yml

# Deployer data that does not depend on the Bob version (model table, vLLM and loader images, guardrail defaults)
- name: Load version independent IBM Bob properties
  include_vars:
    file: "vars/ibm-bob-models.yml"

# The version file is optional and only holds the supported OpenShift versions
- name: Check if a version definition exists for IBM Bob {{ _p_effective_bob_version }}
  stat:
    path: "{{ role_path }}/vars/versions/{{ _p_effective_bob_version }}.yml"
  register: _ibm_bob_version_file_stat

- name: Load version specific properties for IBM Bob {{ _p_effective_bob_version }}
  include_vars:
    file: "vars/versions/{{ _p_effective_bob_version }}.yml"
  when: _ibm_bob_version_file_stat.stat.exists

- name: Set empty list of supported OpenShift versions (no version definition)
  set_fact:
    _ibm_bob_supported_ocp_versions: []
  when: not _ibm_bob_version_file_stat.stat.exists

- name: Warn that IBM Bob version is not specifically validated
  debug:
    msg: "WARNING: IBM Bob version {{ _p_effective_bob_version }} has no version definition in {{ role_path }}/vars/versions/. The OpenShift version is not validated for this version."
  when: not _ibm_bob_version_file_stat.stat.exists

- name: Ensure downloads and bundle directory exists
  file:
    path: "{{ status_dir }}/downloads/ibm-bob/{{ _p_effective_bob_version }}"
    state: directory
    mode: '0755'

- name: Set bundle target paths and facts
  set_fact:
    _ibm_bob_version: "{{ _p_effective_bob_version }}"
    _ibm_bob_bundle_dir: "{{ status_dir }}/downloads/ibm-bob/{{ _p_effective_bob_version }}"
    _ibm_bob_checksum_file: "{{ status_dir }}/downloads/ibm-bob/{{ _p_effective_bob_version }}/.bundle_sha256"

# 2. Check required runtime tools
- name: Ensure Helm is available
  include_role:
    name: helm-download

- name: Check for required command-line tools (oc, bash, openssl, helm)
  command: "which {{ item }}"
  register: _tool_check
  failed_when: _tool_check.rc != 0
  changed_when: false
  loop:
    - oc
    - bash
    - openssl
    - helm

# 3. Locate (and in connected mode download) the release bundle. Sets _ibm_bob_bundle_tarball,
# _ibm_bob_bundle_filename, _ibm_bob_bundle_sha256 and _ibm_bob_bundle_cached_valid.
- name: Locate and download IBM Bob release bundle
  include_tasks: resolve-bundle.yml

# 4. Extract bundle if needed
- name: Check if bobctl executable exists in bundle directory
  stat:
    path: "{{ _ibm_bob_bundle_dir }}/bobctl"
  register: _bobctl_stat

- name: Extract IBM Bob release bundle
  unarchive:
    src: "{{ _ibm_bob_bundle_tarball }}"
    dest: "{{ _ibm_bob_bundle_dir }}"
    remote_src: true
    mode: '0755'
  when: not (_ibm_bob_bundle_cached_valid | bool) or not _bobctl_stat.stat.exists

- name: Ensure bobctl has executable permissions
  file:
    path: "{{ _ibm_bob_bundle_dir }}/bobctl"
    mode: '0755'

- name: Save verified checksum marker file
  copy:
    content: "{{ _ibm_bob_bundle_sha256 }}"
    dest: "{{ _ibm_bob_checksum_file }}"
    mode: '0644'

# 5. Resolve image pull prefix.
# Used by config.yaml (imagePullPrefix) and passed through to ibm-bob-cluster.
# In air-gapped mode (image_registry_name is set on the ibm_bob entry) derive
# the prefix from the matching image_registry entry; otherwise use icr.io.
- name: Determine image pull prefix (connected — default icr.io)
  set_fact:
    _ibm_bob_image_pull_prefix: "icr.io"

- name: Determine image pull prefix (air-gapped — from image_registry entry)
  vars:
    _reg_name: "{{ current_ibm_bob_cluster.image_registry_name | default('') }}"
    _reg_entry: >-
      {{ all_config.image_registry
         | default([])
         | json_query("[?name=='" + _reg_name + "']")
         | first | default({}) }}
  set_fact:
    _ibm_bob_image_pull_prefix: "{{ _reg_entry.registry_url | regex_replace('^https?://', '') }}"
  when: (current_ibm_bob_cluster.image_registry_name | default('')) != ''

# 5b. Resolve effective vLLM runtime images, the model loader pod image and destination paths for openshift_ai_models.
# Used by ibm-bob-mirror-images (to mirror the images) and ibm-bob-openshift-ai-models
# (to configure ServingRuntimes). In air-gapped mode, images are pulled from the private registry.
- name: Resolve effective vLLM runtime images (openshift_ai_models)
  vars:
    _raw_core: >-
      {{ (current_ibm_bob_cluster.openshift_ai_models.runtime_image | default({})).get('core',
         _ibm_bob_vllm_runtime_image | default('vllm/vllm-openai:v0.32.0')) }}
    _raw_guardrail: >-
      {{ (current_ibm_bob_cluster.openshift_ai_models.runtime_image | default({})).get('guardrail',
         _ibm_bob_vllm_runtime_image | default('vllm/vllm-openai:v0.32.0')) }}
    _is_airgap: >-
      {{ (cpd_airgap | default(false) | bool) or ((current_ibm_bob_cluster.image_registry_name | default('')) != '') }}
    _reg_host: "{{ _ibm_bob_image_pull_prefix.split('/')[0] }}"
    _core_first_seg: "{{ _raw_core.split('/')[0] }}"
    _core_repo: >-
      {{ _raw_core.split('/', 1)[1] if ('/' in _raw_core and ('.' in _core_first_seg or ':' in _core_first_seg or _core_first_seg == 'localhost')) else _raw_core }}
    _core_is_private: >-
      {{ _is_airgap and (_raw_core.startswith(_ibm_bob_image_pull_prefix) or _core_first_seg == _reg_host) }}
    _gr_first_seg: "{{ _raw_guardrail.split('/')[0] }}"
    _gr_repo: >-
      {{ _raw_guardrail.split('/', 1)[1] if ('/' in _raw_guardrail and ('.' in _gr_first_seg or ':' in _gr_first_seg or _gr_first_seg == 'localhost')) else _raw_guardrail }}
    _gr_is_private: >-
      {{ _is_airgap and (_raw_guardrail.startswith(_ibm_bob_image_pull_prefix) or _gr_first_seg == _reg_host) }}
    _raw_loader: "{{ _ibm_bob_loader_image | default('registry.access.redhat.com/ubi9/ubi:latest') }}"
    _ld_first_seg: "{{ _raw_loader.split('/')[0] }}"
    _ld_repo: >-
      {{ _raw_loader.split('/', 1)[1] if ('/' in _raw_loader and ('.' in _ld_first_seg or ':' in _ld_first_seg or _ld_first_seg == 'localhost')) else _raw_loader }}
    _ld_is_private: >-
      {{ _is_airgap and (_raw_loader.startswith(_ibm_bob_image_pull_prefix) or _ld_first_seg == _reg_host) }}
  set_fact:
    _ibm_bob_vllm_core_source_image: "{{ _raw_core }}"
    _ibm_bob_vllm_guardrail_source_image: "{{ _raw_guardrail }}"
    _ibm_bob_vllm_core_repo_path: "{{ _core_repo }}"
    _ibm_bob_vllm_guardrail_repo_path: "{{ _gr_repo }}"
    _ibm_bob_vllm_effective_core_image: >-
      {{ _raw_core if (not _is_airgap or _core_is_private) else (_ibm_bob_image_pull_prefix ~ '/' ~ _core_repo) }}
    _ibm_bob_vllm_effective_guardrail_image: >-
      {{ _raw_guardrail if (not _is_airgap or _gr_is_private) else (_ibm_bob_image_pull_prefix ~ '/' ~ _gr_repo) }}
    # Loader pod image (oc cp of model weights in air-gapped mode), mirrored with the vLLM images
    _ibm_bob_loader_source_image: "{{ _raw_loader }}"
    _ibm_bob_loader_repo_path: "{{ _ld_repo }}"
    _ibm_bob_loader_effective_image: >-
      {{ _raw_loader if (not _is_airgap or _ld_is_private) else (_ibm_bob_image_pull_prefix ~ '/' ~ _ld_repo) }}
  when: current_ibm_bob_cluster.openshift_ai_models is defined

# 6. Write a minimal config.yaml so every bobctl sub-command (including
# verify-images) always reads the correct imagePullPrefix, regardless of
# which role invokes bobctl.  ibm-bob-cluster overwrites this with the
# full config (storage classes, premium packages, etc.) during installation.
- name: Ensure instance config directory exists
  file:
    path: "{{ status_dir }}/ibm-bob/{{ current_ibm_bob_cluster.project | default('ibm-bob') }}"
    state: directory
    mode: '0755'

- name: Write minimal config.yaml (imagePullPrefix) for bobctl
  copy:
    dest: "{{ status_dir }}/ibm-bob/{{ current_ibm_bob_cluster.project | default('ibm-bob') }}/config.yaml"
    mode: '0600'
    force: false
    content: |
      # Minimal config written by ibm-bob-variables.
      # ibm-bob-cluster overwrites this with the full configuration.
      global:
        imagePullPrefix: {{ _ibm_bob_image_pull_prefix }}
  register: _ibm_bob_minimal_config

- name: Update imagePullPrefix in existing config.yaml
  lineinfile:
    path: "{{ status_dir }}/ibm-bob/{{ current_ibm_bob_cluster.project | default('ibm-bob') }}/config.yaml"
    regexp: '^\s*imagePullPrefix:'
    line: "  imagePullPrefix: {{ _ibm_bob_image_pull_prefix }}"
  when: not _ibm_bob_minimal_config.changed

# 7. Write a minimal dummy kubeconfig so that `oc registry login --auth-basic`
# works even when no cluster login has happened yet (oc 4.x unconditionally
# requires a kubeconfig with a current-context set, even for credential-only
# registry operations).  Written only when the real kubeconfig is absent.
- name: Ensure openshift status directory exists (needed for kubeconfig)
  file:
    path: "{{ status_dir }}/openshift"
    state: directory
    mode: '0755'

- name: Check if a real kubeconfig already exists
  stat:
    path: "{{ status_dir }}/openshift/kubeconfig"
  register: _ibm_bob_kubeconfig_stat

- name: Write minimal dummy kubeconfig for oc registry login (no cluster needed)
  copy:
    dest: "{{ status_dir }}/openshift/kubeconfig"
    mode: '0600'
    content: |
      apiVersion: v1
      kind: Config
      clusters:
      - cluster:
          server: https://localhost:6443
        name: dummy
      contexts:
      - context:
          cluster: dummy
          user: dummy
        name: dummy
      users:
      - name: dummy
        user:
          token: dummy
      current-context: dummy
      preferences: {}
  when: not _ibm_bob_kubeconfig_stat.stat.exists

- name: Set bobctl executable path and PATH update
  set_fact:
    _ibm_bob_bobctl_path: "{{ _ibm_bob_bundle_dir }}/bobctl"
    _ibm_bob_bobctl_env:
      PATH: "{{ _ibm_bob_bundle_dir }}:{{ lookup('env', 'PATH') }}"
      KUBECONFIG: "{{ status_dir }}/openshift/kubeconfig"
      BOB_CONFIG_FILE: "{{ status_dir }}/ibm-bob/{{ current_ibm_bob_cluster.project | default('ibm-bob') }}/config.yaml"
      BOB_WORK_DIR: "{{ status_dir }}/ibm-bob/{{ current_ibm_bob_cluster.project | default('ibm-bob') }}/work"
      BOB_LOG_DIR: "{{ status_dir }}/log/ibm-bob"

- name: Display resolved IBM Bob variables
  debug:
    msg:
      - "IBM Bob Version: {{ _ibm_bob_version }}"
      - "Bundle Dir: {{ _ibm_bob_bundle_dir }}"
      - "bobctl Executable: {{ _ibm_bob_bobctl_path }}"
      - "imagePullPrefix: {{ _ibm_bob_image_pull_prefix }}"
      - "Supported OCP Versions: {{ (_ibm_bob_supported_ocp_versions | join(', ')) if _ibm_bob_supported_ocp_versions | length > 0 else 'not validated for this version' }}"
