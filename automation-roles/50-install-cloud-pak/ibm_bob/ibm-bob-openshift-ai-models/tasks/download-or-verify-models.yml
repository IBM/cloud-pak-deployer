---
# =============================================================================
# download-or-verify-models.yml
#
# Connected mode (cpd_airgap=false):
#   Creates a Kubernetes Job to download model weights from Hugging Face
#   directly into the PVC. A PVC-side marker file (download-complete) makes
#   re-runs a no-op.
#
# Air-gapped mode (cpd_airgap=true):
#   The weights were already downloaded into
#     status_dir/downloads/ibm-bob/<version>/models/<model-id>/
#     status_dir/downloads/ibm-bob/<version>/models/guardrail/
#   by ibm-bob-mirror-images during env download (entitled-to-portable or
#   entitled-to-private motion).
#
#   This task file:
#     1. Checks that the local marker file exists (env download was run).
#     2. Creates a temporary pod that mounts the PVC.
#     3. Uses oc cp to copy weights from the status dir into the PVC.
#     4. Writes the PVC-side download-complete marker.
#     5. Deletes the temporary pod.
#   The PVC-side marker is checked first; if present the copy is skipped
#   (idempotent re-runs).
# =============================================================================

# ---- HuggingFace token (connected mode) -------------------------------------
- name: Read HuggingFace token from vault (connected mode)
  include_role:
    name: vault-get-secret
  vars:
    secret_name: "{{ current_ibm_bob_cluster.openshift_ai_models.huggingface_token_secret_name }}"
    secret_group: "{{ environment_name }}"
    _p_secret_variable: _ibm_bob_hf_token
  when:
    - not (cpd_airgap | default(false) | bool)
    - (current_ibm_bob_cluster.openshift_ai_models.huggingface_token_secret_name | default('')) != ''

- name: Log when no HuggingFace token is configured (connected mode)
  debug:
    msg: >-
      No huggingface_token_secret_name set; proceeding without a HuggingFace
      token. This works for public repositories but will fail for gated models.
  when:
    - not (cpd_airgap | default(false) | bool)
    - (current_ibm_bob_cluster.openshift_ai_models.huggingface_token_secret_name | default('')) == ''

# ---- Ensure HuggingFace token secret exists in the models namespace ---------
- name: Create HuggingFace token secret in models namespace (connected mode)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ibm-bob-hf-token
        namespace: "{{ _ibm_bob_models_project }}"
      type: Opaque
      stringData:
        token: "{{ _ibm_bob_hf_token | default('') }}"
  no_log: true
  when:
    - not (cpd_airgap | default(false) | bool)
    - (_ibm_bob_hf_token | default('')) != ''
    - not (cpd_dry_run | default(false) | bool)

- name: Log planned HuggingFace token secret (dry run)
  include_role:
    name: log-deployer-activity
  vars:
    _p_activity_description: "Create HuggingFace token secret ibm-bob-hf-token in namespace {{ _ibm_bob_models_project }}"
    _p_activity_comment: "Create the secret ibm-bob-hf-token with the token from vault secret {{ current_ibm_bob_cluster.openshift_ai_models.huggingface_token_secret_name | default('') }} (the token is not logged)"
  when:
    - not (cpd_airgap | default(false) | bool)
    - (_ibm_bob_hf_token | default('')) != ''
    - cpd_dry_run | default(false) | bool

# ---- Core model weights download / verify -----------------------------------
# Idempotency: check whether the Job already completed successfully (marker
# written by the container script). A completed Job means the PVC already has
# the weights; re-creating the Job would be rejected by the API server anyway.
- name: Check if core model download Job already completed (connected mode)
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    name: "ibm-bob-core-model-download"
    namespace: "{{ _ibm_bob_models_project }}"
  register: _ibm_bob_core_job_info
  when: not (cpd_airgap | default(false) | bool)

- name: Set fact — core model Job already complete
  set_fact:
    _ibm_bob_core_job_done: >-
      {{ (_ibm_bob_core_job_info.resources | default([]) | length > 0) and
         ((_ibm_bob_core_job_info.resources[0].status.conditions | default([])
           | selectattr('type', 'equalto', 'Complete')
           | selectattr('status', 'equalto', 'True') | list | length) > 0) }}
  when: not (cpd_airgap | default(false) | bool)

- name: Run core model download Job (connected, not yet complete)
  include_tasks: apply-object.yml
  vars:
    _obj_description: "Create Job ibm-bob-core-model-download to download the core model weights"
    _obj_file_name: "job-core-model-download.yaml"
    _obj_definition: "{{ lookup('template', 'model-download-job.j2') | from_yaml }}"
    _job_name: "ibm-bob-core-model-download"
    _pvc_name: "ibm-bob-core-model"
    _hf_repo: "{{ _ibm_bob_core_hf_repo }}"
    _draft_hf_repo: "{{ _ibm_bob_core_quant_def.draft_hf_repo | default('') }}"
    _draft_model_dir: "{{ _ibm_bob_core_quant_def.draft_model_dir | default('') }}"
  when:
    - not (cpd_airgap | default(false) | bool)
    - not (_ibm_bob_core_job_done | default(false) | bool)

- name: Wait for core model download Job to complete (connected mode)
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    name: "ibm-bob-core-model-download"
    namespace: "{{ _ibm_bob_models_project }}"
  register: _ibm_bob_core_download_job
  until: >-
    (_ibm_bob_core_download_job.resources | default([]) | length > 0) and
    ((_ibm_bob_core_download_job.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Complete')
      | selectattr('status', 'equalto', 'True') | list | length) > 0 or
     (_ibm_bob_core_download_job.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Failed')
      | selectattr('status', 'equalto', 'True') | list | length) > 0)
  retries: 360
  delay: 30
  failed_when: >-
    (_ibm_bob_core_download_job.resources | default([]) | length == 0) or
    ((_ibm_bob_core_download_job.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Failed')
      | selectattr('status', 'equalto', 'True') | list | length) > 0)
  when:
    - not (cpd_airgap | default(false) | bool)
    - not (cpd_dry_run | default(false) | bool)
    - not (_ibm_bob_core_job_done | default(false) | bool)

- name: Log wait for the core model download Job (dry run)
  include_role:
    name: log-deployer-activity
  vars:
    _p_activity_description: "Wait for Job ibm-bob-core-model-download to complete"
    _p_activity_comment: "Wait until the Job ibm-bob-core-model-download in namespace {{ _ibm_bob_models_project }} is Complete (up to 360 x 30 seconds)"
  when:
    - not (cpd_airgap | default(false) | bool)
    - cpd_dry_run | default(false) | bool
    - not (_ibm_bob_core_job_done | default(false) | bool)

- name: Check if guardrail model download Job already completed (connected mode)
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    name: "ibm-bob-guardrail-model-download"
    namespace: "{{ _ibm_bob_models_project }}"
  register: _ibm_bob_guardrail_job_info
  when: not (cpd_airgap | default(false) | bool)

- name: Set fact — guardrail model Job already complete
  set_fact:
    _ibm_bob_guardrail_job_done: >-
      {{ (_ibm_bob_guardrail_job_info.resources | default([]) | length > 0) and
         ((_ibm_bob_guardrail_job_info.resources[0].status.conditions | default([])
           | selectattr('type', 'equalto', 'Complete')
           | selectattr('status', 'equalto', 'True') | list | length) > 0) }}
  when: not (cpd_airgap | default(false) | bool)

- name: Run guardrail model download Job (connected, not yet complete)
  include_tasks: apply-object.yml
  vars:
    _obj_description: "Create Job ibm-bob-guardrail-model-download to download the guardrail model weights"
    _obj_file_name: "job-guardrail-model-download.yaml"
    _obj_definition: "{{ lookup('template', 'model-download-job.j2') | from_yaml }}"
    _job_name: "ibm-bob-guardrail-model-download"
    _pvc_name: "ibm-bob-guardrail-model"
    _hf_repo: "{{ _ibm_bob_guardrail_model_defaults.model_id }}"
    _draft_hf_repo: ""
    _draft_model_dir: ""
  when:
    - not (cpd_airgap | default(false) | bool)
    - not (_ibm_bob_guardrail_job_done | default(false) | bool)

- name: Wait for guardrail model download Job to complete (connected mode)
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    name: "ibm-bob-guardrail-model-download"
    namespace: "{{ _ibm_bob_models_project }}"
  register: _ibm_bob_guardrail_download_job
  until: >-
    (_ibm_bob_guardrail_download_job.resources | default([]) | length > 0) and
    ((_ibm_bob_guardrail_download_job.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Complete')
      | selectattr('status', 'equalto', 'True') | list | length) > 0 or
     (_ibm_bob_guardrail_download_job.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Failed')
      | selectattr('status', 'equalto', 'True') | list | length) > 0)
  retries: 360
  delay: 30
  failed_when: >-
    (_ibm_bob_guardrail_download_job.resources | default([]) | length == 0) or
    ((_ibm_bob_guardrail_download_job.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Failed')
      | selectattr('status', 'equalto', 'True') | list | length) > 0)
  when:
    - not (cpd_airgap | default(false) | bool)
    - not (cpd_dry_run | default(false) | bool)
    - not (_ibm_bob_guardrail_job_done | default(false) | bool)

- name: Log wait for the guardrail model download Job (dry run)
  include_role:
    name: log-deployer-activity
  vars:
    _p_activity_description: "Wait for Job ibm-bob-guardrail-model-download to complete"
    _p_activity_comment: "Wait until the Job ibm-bob-guardrail-model-download in namespace {{ _ibm_bob_models_project }} is Complete (up to 360 x 30 seconds)"
  when:
    - not (cpd_airgap | default(false) | bool)
    - cpd_dry_run | default(false) | bool
    - not (_ibm_bob_guardrail_job_done | default(false) | bool)

# ---- Air-gapped: upload weights from status_dir to PVCs --------------------
- name: Upload model weights from status_dir to cluster PVCs (air-gapped)
  block:
    - name: Set local model weights base directory
      set_fact:
        _ibm_bob_models_dl_base: "{{ status_dir }}/downloads/ibm-bob/{{ _ibm_bob_version }}/models"

    # -- Verify local markers exist (env download must have run) --
    - name: Check that core model weights were downloaded locally
      stat:
        path: "{{ _ibm_bob_models_dl_base }}/{{ _ibm_bob_selected_model.id }}/download-complete"
      register: _ibm_bob_core_local_marker

    - name: Fail if core model weights are not in status_dir (env download not run)
      fail:
        msg: >-
          Air-gapped mode: the core model weights for '{{ _ibm_bob_selected_model.id }}'
          were not found in '{{ _ibm_bob_models_dl_base }}/{{ _ibm_bob_selected_model.id }}'.
          Run env download on the connected side first:
            CPD_AIRGAP=false ./cp-deploy.sh env download -c <config-dir> -l <status-dir>
          Then carry the status dir to this air-gapped site and re-run env apply.
      when: not _ibm_bob_core_local_marker.stat.exists

    - name: Check that guardrail model weights were downloaded locally
      stat:
        path: "{{ _ibm_bob_models_dl_base }}/guardrail/download-complete"
      register: _ibm_bob_guardrail_local_marker

    - name: Fail if guardrail model weights are not in status_dir (env download not run)
      fail:
        msg: >-
          Air-gapped mode: the guardrail model weights were not found in
          '{{ _ibm_bob_models_dl_base }}/guardrail'.
          Run env download on the connected side first.
      when: not _ibm_bob_guardrail_local_marker.stat.exists

    # -- Upload to the cluster PVCs (changes the cluster: not in dry run) --
    - name: Upload model weights into the model PVCs through temporary loader pods
      include_tasks: upload-model-weights.yml
      when: not (cpd_dry_run | default(false) | bool)

    - name: Log planned upload of the model weights (dry run)
      include_role:
        name: log-deployer-activity
      vars:
        _p_activity_description: "Upload IBM Bob model weights to the model PVCs"
        _p_activity_comment: >-
          For the core and the guardrail model: create a temporary loader pod that mounts the PVC in namespace
          {{ _ibm_bob_models_project }}, copy the weights from {{ _ibm_bob_models_dl_base }} with oc cp (skipping
          files that are already on the PVC), write the download-complete marker and delete the loader pod
      when: cpd_dry_run | default(false) | bool

  when: cpd_airgap | default(false) | bool
