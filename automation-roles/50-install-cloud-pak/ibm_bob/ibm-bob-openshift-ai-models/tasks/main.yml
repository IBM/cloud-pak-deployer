---
# =============================================================================
# ibm-bob-openshift-ai-models
#
# Creates PVCs, downloads model weights (connected mode) or verifies they are
# pre-loaded (air-gapped mode), then creates KServe ServingRuntime and
# InferenceService objects for the core model and the guardrail model.
# Waits for the InferenceServices to be Ready, registers their in-cluster URLs.
#
# Prerequisites:
#   current_ibm_bob_cluster       — full ibm_bob config object
#   _ibm_bob_ai_models            — per-model table from ibm-bob-variables
#   _ibm_bob_guardrail_model_defaults — guardrail defaults from ibm-bob-variables
#   ocp_storage_class_file        — RWX storage class (from get-openshift-storage)
#   status_dir, environment_name  — standard deployer vars
#   cpd_airgap                    — boolean (connected vs air-gapped)
#
# Outputs (registered as facts for subsequent tasks):
#   _ibm_bob_core_model_url       — in-cluster inference URL for core model
#   _ibm_bob_guardrail_url        — in-cluster inference URL for guardrail model
# =============================================================================

# ---- Resolve the selected model from the version table ----------------------
- name: Resolve core model definition from version table
  set_fact:
    _ibm_bob_selected_model: >-
      {{ _ibm_bob_ai_models
         | selectattr('id', 'equalto', current_ibm_bob_cluster.openshift_ai_models.core_model)
         | list | first }}

- name: Fail if core model is not found in the version table
  fail:
    msg: >-
      core_model '{{ current_ibm_bob_cluster.openshift_ai_models.core_model }}' was not found
      in the IBM Bob AI models table. This is a deployer bug; check _ibm_bob_ai_models in the
      version vars file.
  when: _ibm_bob_selected_model is not defined or _ibm_bob_selected_model == ''

# ---- Resolve the quantization -----------------------------------------------
- name: Resolve quantization and quantization-specific definition
  set_fact:
    _ibm_bob_core_quantization: >-
      {{ current_ibm_bob_cluster.openshift_ai_models.quantization
         | default(_ibm_bob_selected_model.default_quantization) }}

- name: Fail if the quantization is not defined for the core model
  fail:
    msg: >-
      Quantization '{{ _ibm_bob_core_quantization }}' is not defined for core_model
      '{{ _ibm_bob_selected_model.id }}'. Supported: {{ _ibm_bob_selected_model.quantizations.keys() | list | join(', ') }}.
  when: _ibm_bob_core_quantization not in _ibm_bob_selected_model.quantizations

- name: Set quantization-specific facts
  set_fact:
    _ibm_bob_core_quant_def: "{{ _ibm_bob_selected_model.quantizations[_ibm_bob_core_quantization] }}"

# ---- Derive working values --------------------------------------------------
- name: Set working facts for the model serving deployment
  set_fact:
    _ibm_bob_models_project: >-
      {{ current_ibm_bob_cluster.openshift_ai_models.project
         | default(current_ibm_bob_cluster.project + '-models') }}
    _ibm_bob_core_gpus: >-
      {{ current_ibm_bob_cluster.openshift_ai_models.gpus_per_core_model
         | default(_ibm_bob_selected_model.default_gpus) | int }}
    _ibm_bob_guardrail_gpus: >-
      {{ current_ibm_bob_cluster.openshift_ai_models.gpus_per_guardrail_model
         | default(_ibm_bob_guardrail_model_defaults.default_gpus) | int }}
    _ibm_bob_core_storage: >-
      {{ (current_ibm_bob_cluster.openshift_ai_models.storage_size | default({})).get('core',
         _ibm_bob_core_quant_def.default_storage) }}
    _ibm_bob_guardrail_storage: >-
      {{ (current_ibm_bob_cluster.openshift_ai_models.storage_size | default({})).get('guardrail',
         _ibm_bob_guardrail_model_defaults.default_storage) }}
    _ibm_bob_skip_gpu_check: >-
      {{ current_ibm_bob_cluster.openshift_ai_models.skip_gpu_check | default(false) | bool }}
    _ibm_bob_core_hf_repo: "{{ _ibm_bob_core_quant_def.hf_repo }}"

# ---- Create models namespace ------------------------------------------------
# In dry run (cpd_dry_run) objects are written to YAML files and logged in
# deployer-activities.log, not applied (see apply-object.yml). Tasks that carry secrets
# are skipped and replaced by a comment activity.
- name: Ensure models namespace {{ _ibm_bob_models_project }} exists
  include_tasks: apply-object.yml
  vars:
    _obj_description: "Create namespace {{ _ibm_bob_models_project }} for the IBM Bob models"
    _obj_file_name: "models-namespace.yaml"
    _obj_definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ _ibm_bob_models_project }}"
        labels:
          app.kubernetes.io/managed-by: cloud-pak-deployer
          ibm-bob/models-for: "{{ current_ibm_bob_cluster.project }}"

# ---- Ensure image pull secret exists in models namespace (air-gapped) -------
- name: Read private registry credentials from vault (openshift_ai_models)
  include_role:
    name: vault-get-secret
  vars:
    secret_name: "image-registry-{{ current_ibm_bob_cluster.image_registry_name }}"
    secret_group: "{{ environment_name }}"
    _p_secret_variable: _ibm_bob_models_registry_creds
  when: (current_ibm_bob_cluster.image_registry_name | default('')) != ''

- name: Create ibm-entitlement-key pull secret in models namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      type: kubernetes.io/dockerconfigjson
      metadata:
        name: ibm-entitlement-key
        namespace: "{{ _ibm_bob_models_project }}"
      data:
        .dockerconfigjson: >-
          {{ ({
            'auths': {
              _ibm_bob_image_pull_prefix.split('/')[0]: {
                'username': _ibm_bob_models_registry_creds.split(':')[0],
                'password': (_ibm_bob_models_registry_creds.split(':', 1)[1] | default('')),
                'auth': (_ibm_bob_models_registry_creds | b64encode)
              }
            }
          }) | to_json | b64encode }}
  no_log: true
  when:
    - (current_ibm_bob_cluster.image_registry_name | default('')) != ''
    - (_ibm_bob_models_registry_creds | default('')) != ''
    - not (cpd_dry_run | default(false) | bool)

- name: Link ibm-entitlement-key to default service account in models namespace
  kubernetes.core.k8s:
    state: patched
    kind: ServiceAccount
    name: default
    namespace: "{{ _ibm_bob_models_project }}"
    definition:
      imagePullSecrets:
        - name: ibm-entitlement-key
  when:
    - (current_ibm_bob_cluster.image_registry_name | default('')) != ''
    - (_ibm_bob_models_registry_creds | default('')) != ''
    - not (cpd_dry_run | default(false) | bool)

- name: Log planned pull secret in models namespace (dry run)
  include_role:
    name: log-deployer-activity
  vars:
    _p_activity_description: "Create ibm-entitlement-key pull secret in namespace {{ _ibm_bob_models_project }}"
    _p_activity_comment: >-
      Create the pull secret ibm-entitlement-key for {{ _ibm_bob_image_pull_prefix.split('/')[0] }} in namespace
      {{ _ibm_bob_models_project }} and link it to the default service account (the credentials are not logged)
  when:
    - (current_ibm_bob_cluster.image_registry_name | default('')) != ''
    - cpd_dry_run | default(false) | bool

- name: Clear models registry credential fact
  set_fact:
    _ibm_bob_models_registry_creds: ""
  no_log: true

# ---- Persistent volume claims -----------------------------------------------
- name: Create PVC for core model weights ({{ _ibm_bob_selected_model.id }})
  include_tasks: apply-object.yml
  vars:
    _obj_description: "Create PVC ibm-bob-core-model for core model weights ({{ _ibm_bob_selected_model.id }})"
    _obj_file_name: "pvc-core-model.yaml"
    _obj_definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "ibm-bob-core-model"
        namespace: "{{ _ibm_bob_models_project }}"
        labels:
          app.kubernetes.io/managed-by: cloud-pak-deployer
      spec:
        accessModes:
          - ReadWriteMany
        resources:
          requests:
            storage: "{{ _ibm_bob_core_storage }}"
        storageClassName: "{{ ocp_storage_class_file }}"

- name: Create PVC for guardrail model weights
  include_tasks: apply-object.yml
  vars:
    _obj_description: "Create PVC ibm-bob-guardrail-model for guardrail model weights"
    _obj_file_name: "pvc-guardrail-model.yaml"
    _obj_definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "ibm-bob-guardrail-model"
        namespace: "{{ _ibm_bob_models_project }}"
        labels:
          app.kubernetes.io/managed-by: cloud-pak-deployer
      spec:
        accessModes:
          - ReadWriteMany
        resources:
          requests:
            storage: "{{ _ibm_bob_guardrail_storage }}"
        storageClassName: "{{ ocp_storage_class_file }}"

# ---- Download or verify model weights ---------------------------------------
- name: Download or verify model weights
  include_tasks: download-or-verify-models.yml

# ---- ServingRuntime and InferenceService ------------------------------------
- name: Deploy ServingRuntime and InferenceService for models
  include_tasks: deploy-inference-services.yml

# ---- Wait for InferenceServices to be Ready ---------------------------------
- name: Wait for InferenceServices to be Ready
  include_tasks: wait-for-inference-services.yml
