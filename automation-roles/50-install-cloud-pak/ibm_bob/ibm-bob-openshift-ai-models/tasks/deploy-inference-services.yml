---
# =============================================================================
# deploy-inference-services.yml
#
# Creates one ServingRuntime and one InferenceService per model
# (core model and guardrail model) in the models namespace.
# =============================================================================

# ---- ServingRuntime ---------------------------------------------------------
# One vLLM image for both models, overridable per inference service with
# openshift_ai_models.runtime_image.core / .guardrail
- name: Create vLLM ServingRuntime for core model ({{ _ibm_bob_selected_model.id }})
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'vllm-serving-runtime.j2') | from_yaml }}"
  vars:
    _sr_name: "ibm-bob-core-vllm"
    _sr_namespace: "{{ _ibm_bob_models_project }}"
    _sr_image: >-
      {{ _ibm_bob_vllm_effective_core_image
         | default((current_ibm_bob_cluster.openshift_ai_models.runtime_image | default({})).get('core',
            _ibm_bob_vllm_runtime_image | default('vllm/vllm-openai:v0.32.0'))) }}
    _sr_env: "{{ _ibm_bob_core_quant_def.env | default([]) }}"

- name: Create vLLM ServingRuntime for guardrail model
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'vllm-serving-runtime.j2') | from_yaml }}"
  vars:
    _sr_name: "ibm-bob-guardrail-vllm"
    _sr_namespace: "{{ _ibm_bob_models_project }}"
    _sr_image: >-
      {{ _ibm_bob_vllm_effective_guardrail_image
         | default((current_ibm_bob_cluster.openshift_ai_models.runtime_image | default({})).get('guardrail',
            _ibm_bob_vllm_runtime_image | default('vllm/vllm-openai:v0.32.0'))) }}
    _sr_env: []

# ---- Core model InferenceService --------------------------------------------
# The tensor-parallel size always follows the number of GPUs of the core model
- name: Compute effective vLLM args for core model
  set_fact:
    _ibm_bob_core_vllm_args: >-
      {{ ['--tensor-parallel-size=' ~ _ibm_bob_core_gpus]
         + _ibm_bob_selected_model.vllm_args
         + (_ibm_bob_core_quant_def.vllm_args | default([]))
         + (current_ibm_bob_cluster.openshift_ai_models.vllm_extra_args | default([])) }}

# Right after OpenShift AI is installed, the KServe admission webhook can reject the request because
# its CA bundle has not been injected yet ("x509: certificate signed by unknown authority").
# Only webhook errors are retried.
- name: Create InferenceService for core model ({{ _ibm_bob_selected_model.id }})
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'inference-service.j2') | from_yaml }}"
  vars:
    _isvc_name: "ibm-bob-core-model"
    _isvc_namespace: "{{ _ibm_bob_models_project }}"
    _isvc_runtime: "ibm-bob-core-vllm"
    _isvc_pvc: "ibm-bob-core-model"
    _isvc_gpus: "{{ _ibm_bob_core_gpus }}"
    _isvc_vllm_args: "{{ _ibm_bob_core_vllm_args }}"
  register: _ibm_bob_core_isvc
  until: _ibm_bob_core_isvc is succeeded or 'webhook' not in (_ibm_bob_core_isvc.msg | default(''))
  retries: 20
  delay: 15

# ---- Guardrail model InferenceService ---------------------------------------
- name: Create InferenceService for guardrail model
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'inference-service.j2') | from_yaml }}"
  vars:
    _isvc_name: "ibm-bob-guardrail-model"
    _isvc_namespace: "{{ _ibm_bob_models_project }}"
    _isvc_runtime: "ibm-bob-guardrail-vllm"
    _isvc_pvc: "ibm-bob-guardrail-model"
    _isvc_gpus: "{{ _ibm_bob_guardrail_gpus }}"
    _isvc_vllm_args: "{{ _ibm_bob_guardrail_model_defaults.vllm_args }}"
  register: _ibm_bob_guardrail_isvc
  until: _ibm_bob_guardrail_isvc is succeeded or 'webhook' not in (_ibm_bob_guardrail_isvc.msg | default(''))
  retries: 20
  delay: 15
