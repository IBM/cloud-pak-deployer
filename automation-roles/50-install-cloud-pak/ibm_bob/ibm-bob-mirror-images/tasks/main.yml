---
# =============================================================================
# ibm-bob-mirror-images: Mirror IBM Bob images to a private registry.
#
# Called from playbook-env-download.yml (play 30) for each ibm_bob entry
# that carries an image_registry_name.
#
# Parameters (set by the playbook before calling this role):
#   current_ibm_bob_cluster     full ibm_bob config object
#   _p_mirror_motion            entitled-to-portable | entitled-to-private
#                               | portable-to-private
#
# The role uses _ibm_bob_bobctl_path and _ibm_bob_bobctl_env which are set
# by ibm-bob-variables (called first from the playbook).
# =============================================================================

- name: Resolve IBM Bob variables and bundle for mirror motion {{ _p_mirror_motion }}
  include_role:
    name: ibm-bob-variables

# ---- Models-only mode (openshift_ai_models) ---------------------------------
# playbook-env-download.yml sets _p_models_only to download just the model weights
# from Hugging Face into status_dir, without mirroring any container images.
- name: Download and package model weights only (openshift_ai_models)
  block:
    - name: Download model weights for openshift_ai_models
      include_tasks: download-model-weights.yml
    - meta: end_role
  when: _p_models_only | default(false) | bool

# ---- Resolve private registry details and credentials -----------------------
# Not needed for entitled-to-portable (download to local dir only); required
# for entitled-to-private and portable-to-private (both push to a registry).
- name: Resolve private image registry entry for {{ current_ibm_bob_cluster.image_registry_name }}
  set_fact:
    _ibm_bob_registry: >-
      {{ all_config.image_registry
         | json_query("[?name=='" + current_ibm_bob_cluster.image_registry_name + "']")
         | first | default({}) }}
  when: _p_mirror_motion != 'entitled-to-portable'

- name: Fail if the image registry entry is not defined
  fail:
    msg: >-
      image_registry entry '{{ current_ibm_bob_cluster.image_registry_name }}' was not found
      in all_config.image_registry. Add it to your configuration.
  when:
    - _p_mirror_motion != 'entitled-to-portable'
    - _ibm_bob_registry == {}

- name: Read private registry credentials from vault
  include_role:
    name: vault-get-secret
  vars:
    secret_name: "image-registry-{{ current_ibm_bob_cluster.image_registry_name }}"
    secret_group: "{{ environment_name }}"
    _p_secret_variable: _ibm_bob_registry_creds
  when: _p_mirror_motion != 'entitled-to-portable'

- name: Fail if private registry credentials are not in the vault
  fail:
    msg: >-
      Vault secret 'image-registry-{{ current_ibm_bob_cluster.image_registry_name }}' in group
      '{{ environment_name }}' is empty. Set it with:
        ./cp-deploy.sh vault set -vs=image-registry-{{ current_ibm_bob_cluster.image_registry_name }}=user:password
  when:
    - _p_mirror_motion != 'entitled-to-portable'
    - (_ibm_bob_registry_creds | default('')) == ''

- name: Fail if private registry credentials are not in user:password format
  fail:
    msg: >-
      Vault secret 'image-registry-{{ current_ibm_bob_cluster.image_registry_name }}' must be in
      the format 'user:password' (e.g. 'iamapikey:<api_key>').
  when:
    - _p_mirror_motion != 'entitled-to-portable'
    - not (_ibm_bob_registry_creds is search(':'))

# Parse registry_url into hostname and path (namespace prefix)
- name: Parse registry URL into hostname and namespace prefix
  vars:
    _no_scheme: "{{ _ibm_bob_registry.registry_url | regex_replace('^https?://', '') }}"
    _host_part: "{{ _no_scheme.split('/')[0] }}"
    _namespace: "{{ _no_scheme.split('/', 1)[1] | default('') }}"
  set_fact:
    _ibm_bob_registry_host: "{{ _host_part }}"
    _ibm_bob_registry_namespace: "{{ _namespace }}"
    _ibm_bob_registry_full_path: "{{ _no_scheme }}"
  when: _p_mirror_motion != 'entitled-to-portable'

- name: Log registry target
  debug:
    msg: "Mirror target registry: {{ _ibm_bob_registry_full_path }} (motion: {{ _p_mirror_motion }})"
  when: _p_mirror_motion != 'entitled-to-portable'

# ---- Read entitlement key (needed for entitled-to-portable and entitled-to-private) --
- name: Read IBM CP entitlement key from vault
  include_role:
    name: vault-get-secret
  vars:
    secret_name: "ibm_cp_entitlement_key"
    secret_group: "{{ environment_name }}"
    _p_secret_variable: _ibm_bob_mirror_entitlement_key
  when: _p_mirror_motion in ['entitled-to-portable', 'entitled-to-private']

- name: Fail if entitlement key is not set for this mirror motion
  fail:
    msg: >-
      Vault secret 'ibm_cp_entitlement_key' in group '{{ environment_name }}' is empty.
      It is required for mirror motion '{{ _p_mirror_motion }}'.
  when:
    - _p_mirror_motion in ['entitled-to-portable', 'entitled-to-private']
    - (_ibm_bob_mirror_entitlement_key | default('')) == ''

# ---- Set download-images target directory -----------------------------------
- name: Set image download directory for portable motion
  set_fact:
    _ibm_bob_images_dir: "{{ status_dir }}/downloads/ibm-bob/{{ _ibm_bob_version }}/images"

- name: Ensure image download directory exists (portable paths)
  file:
    path: "{{ _ibm_bob_images_dir }}"
    state: directory
    mode: '0755'
  when: _p_mirror_motion in ['entitled-to-portable', 'portable-to-private']

# ---- entitled-to-portable: bobctl download-images ---------------------------
- name: "Mirror (entitled-to-portable): bobctl download-images"
  include_role:
    name: run-command
  vars:
    _p_command_description: "IBM Bob: download images to local directory (entitled-to-portable)"
    _p_command: >-
      {{ _ibm_bob_bobctl_path }} download-images
      --to-dir {{ _ibm_bob_images_dir }}
      --src-creds "cp:$IBM_BOB_MIRROR_KEY"
    _p_command_environment: "{{ _ibm_bob_bobctl_env | combine({'IBM_BOB_MIRROR_KEY': _ibm_bob_mirror_entitlement_key}) }}"
    _p_command_log_file: "{{ status_dir }}/log/ibm-bob/{{ current_ibm_bob_cluster.project }}-download-images.log"
  no_log: true
  when: _p_mirror_motion == 'entitled-to-portable'

# ---- entitled-to-private: bobctl mirror-images ------------------------------
- name: "Mirror (entitled-to-private): bobctl mirror-images"
  include_role:
    name: run-command
  vars:
    _p_command_description: "IBM Bob: mirror images from entitled registry to private registry (entitled-to-private)"
    _p_command: >-
      {{ _ibm_bob_bobctl_path }} mirror-images
      --dest-registry {{ _ibm_bob_registry_full_path }}
      --src-creds "cp:$IBM_BOB_MIRROR_KEY"
      --dest-creds "$IBM_BOB_REGISTRY_CREDS"
    _p_command_environment: "{{ _ibm_bob_bobctl_env | combine({'IBM_BOB_MIRROR_KEY': _ibm_bob_mirror_entitlement_key, 'IBM_BOB_REGISTRY_CREDS': _ibm_bob_registry_creds}) }}"
    _p_command_log_file: "{{ status_dir }}/log/ibm-bob/{{ current_ibm_bob_cluster.project }}-mirror-images.log"
  no_log: true
  when: _p_mirror_motion == 'entitled-to-private'

# ---- portable-to-private: bobctl upload-images ------------------------------
- name: Verify that portable images directory exists (portable-to-private)
  stat:
    path: "{{ _ibm_bob_images_dir }}"
  register: _ibm_bob_images_dir_stat
  when: _p_mirror_motion == 'portable-to-private'

- name: Fail if portable images directory does not exist
  fail:
    msg: >-
      The portable images directory '{{ _ibm_bob_images_dir }}' does not exist.
      Run the 'entitled-to-portable' motion first to download the images.
  when:
    - _p_mirror_motion == 'portable-to-private'
    - not _ibm_bob_images_dir_stat.stat.exists

# bobctl workaround: bobctl download-images intentionally writes "placeholder"
# as the destination registry in every *-from-filesystem-mapping.lst file so
# the files are portable.  However bobctl upload-images passes those files
# verbatim to `oc image mirror` without substituting the real --dest-registry,
# so oc tries to push to a host literally named "placeholder" and is denied.
# We patch the mapping files here before upload-images runs.  The replace is
# idempotent: if a future bobctl version fixes this the task simply reports
# "ok=0 changed=0".
- name: "Find from-filesystem mapping files (portable-to-private)"
  find:
    paths: "{{ status_dir }}/ibm-bob/{{ current_ibm_bob_cluster.project }}/work"
    patterns: "*-from-filesystem-mapping.lst"
  register: _ibm_bob_mapping_files
  when: _p_mirror_motion == 'portable-to-private'

- name: "Check if mapping files contain placeholder registry (bobctl portable-to-private workaround)"
  command: >-
    grep -lP '^file://[^=]+=placeholder/' {{ item.path }}
  register: _ibm_bob_mapping_placeholder_check
  changed_when: false
  failed_when: false
  loop: "{{ _ibm_bob_mapping_files.files | default([]) }}"
  when: _p_mirror_motion == 'portable-to-private'

- name: "Log placeholder patch for from-filesystem mapping files (portable-to-private)"
  debug:
    msg: >-
      Patching {{ item.item.path | basename }}: replacing 'placeholder' with
      '{{ _ibm_bob_registry_full_path }}' (bobctl portable-to-private workaround).
  loop: "{{ _ibm_bob_mapping_placeholder_check.results | default([]) }}"
  when:
    - _p_mirror_motion == 'portable-to-private'
    - item.rc == 0

- name: "Replace placeholder with actual registry in from-filesystem mapping files"
  replace:
    path: "{{ item.item.path }}"
    regexp: '^(file://[^=]+=)placeholder/'
    replace: '\1{{ _ibm_bob_registry_full_path }}/'
  loop: "{{ _ibm_bob_mapping_placeholder_check.results | default([]) }}"
  when:
    - _p_mirror_motion == 'portable-to-private'
    - item.rc == 0

- name: "Mirror (portable-to-private): bobctl upload-images"
  include_role:
    name: run-command
  vars:
    _p_command_description: "IBM Bob: upload images from local directory to private registry (portable-to-private)"
    _p_command: >-
      {{ _ibm_bob_bobctl_path }} upload-images
      --from-dir {{ _ibm_bob_images_dir }}
      --dest-registry {{ _ibm_bob_registry_full_path }}
      --dest-creds "$IBM_BOB_REGISTRY_CREDS"
    _p_command_environment: "{{ _ibm_bob_bobctl_env | combine({'IBM_BOB_REGISTRY_CREDS': _ibm_bob_registry_creds}) }}"
    _p_command_log_file: "{{ status_dir }}/log/ibm-bob/{{ current_ibm_bob_cluster.project }}-upload-images.log"
  no_log: true
  when: _p_mirror_motion == 'portable-to-private'

# ---- Clear secrets from facts -----------------------------------------------
- name: Clear mirror credential facts
  set_fact:
    _ibm_bob_mirror_entitlement_key: ""
    _ibm_bob_registry_creds: ""
  no_log: true
