
# -------------------------------------------
# NOTE: Instructions for adding a new version
# -------------------------------------------
# 1. Add stanza for the new version - copy/paste existing
#
# 2. See the documentation section "Adding catalog sources":
#    https://www.ibm.com/docs/en/cloud-paks/cp-integration/16.2.0?topic=images-adding-catalog-sources-openshift-cluster
#
# 3. Update "case_version" properties - use versions defined in the example commands in the above documentation section
#
# 4. Install operators and update "channel" properties 
#
# 5. Imagine you want to create instances, read the license ID and product versions from YAML structures,
#    and update the "license" and "version" properties.
#    Use the following CRDs:
#    - platform-ui:                 PlatformNavigator         
#    - automation-assets:           AssetRepository
#    - api-connect:                 APIConnectCluster
#    - end-to-end-monitoring:       Monitoring
#    - app-connect-int-dashboard:   Dashboard
#    - app-connect-int-designer:    DesignerAuthoring
#    - mq-queue-manager:            QueueManager
#    - event-streams:               EventStreams
#    - event-endpoint-management:   EventEndpointManagement
#    - datapower-gateway:           DataPowerService

