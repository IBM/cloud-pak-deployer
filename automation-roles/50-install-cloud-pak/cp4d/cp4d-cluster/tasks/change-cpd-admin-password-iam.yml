---
# Store password from vault into OpenShift secret (also in case of reinstallation with existing vault secret)
- name: Update {{ cp4d_login_username }} password in OpenShift secret when using Foundational Services IAM
  kubernetes.core.k8s:
    state: present
    api_version: v1
    kind: Secret
    name: platform-auth-idp-credentials
    namespace: "{{ current_cp4d_cluster.project }}"
    definition:
      data:
        admin_password: "{{ _cp4d_admin_password_vault | b64encode }}"
  register: _idp_password_changed

- include_tasks: restart-idp-pods.yml
  when: _idp_password_changed.changed | bool