---
- name: Restart the platform auth service pod
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Pod
    namespace: "{{ current_cp4d_cluster.project }}"
    label_selectors:
    - app=platform-auth-service

- name: Restart the platform identity management pod
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Pod
    namespace: "{{ current_cp4d_cluster.project }}"
    label_selectors:
    - app=platform-identity-management

- name: Restart the platform identity provider pod
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Pod
    namespace: "{{ current_cp4d_cluster.project }}"
    label_selectors:
    - app=platform-identity-provider