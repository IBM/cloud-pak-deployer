---
- name: Validate mandatory variables are defined
  assert:
    that:
      - cloud_platform is defined

- name: Validate cloud_platform is implemented
  fail: msg="cloud_platform {{ cloud_platform }} is not implemented, current implemented cloud platforms are {{ implemented_cloud_platform_types }} "
  when: "cloud_platform not in implemented_cloud_platform_types"

- name: Retrieve or detect cloud infrastructure type for OpenShift cluster {{ current_cp4d_cluster.openshift_cluster_name }}
  include_role:
    name: retrieve-cloud-infra-type
  vars:
    _p_openshift_cluster_name: "{{ current_cp4d_cluster.openshift_cluster_name }}"

- include_tasks: existing-ocp-pwx.yml  
  when: 
  - cloud_platform == 'existing-ocp'
  - _storage_type == 'pwx'

- name: Install GPU and OpenShift AI prerequisites (shared role)
  include_role:
    name: openshift-ai-gpu-prereqs
  vars:
    _p_openshift_cluster_name: "{{ current_cp4d_cluster.openshift_cluster_name }}"
    _p_nfd_gpu_required: "{{ _nfd_gpu_required }}"
    _p_openshift_ai_required: "{{ _openshift_ai_required }}"
  # retrieve-cloud-infra-type was already called above; _current_openshift_cluster
  # and _existing_ocp_infra_type are already set so the shared role skips the lookup.
  when: _nfd_gpu_required or _openshift_ai_required

- include_tasks: cp4d-install-knative.yml
  when: 
  - _p_cp4d_version >= '4.8.0'
  - (_knative_eventing_dependency | default(False))

- name: Prepare Cloud Pak for Data cluster-wide configuration on cluster {{ current_cp4d_cluster.openshift_cluster_name }}
  include_tasks: cp4d-prepare-openshift.yml
  when: ( current_cp4d_cluster.change_node_settings | default(True) | bool )
