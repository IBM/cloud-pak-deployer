---
- name: List all images for {{ _oci_location }}/patch
  shell: |
    oc image info '{{ _oci_location }}/patch:{{ _cp4d_version }}*' -o json
  register: _oc_image_info

# The oc command returns concatenated JSON objects, not a valid JSON array.
# Wrap them in [ ... ] by replacing "}{" boundaries so from_json works.
- name: Parse image info into a list
  set_fact:
    _patch_images: >-
      {{ ('[' + _oc_image_info.stdout | replace('}{', '},{') + ']') | from_json }}

# Extract the patch number from each tag (the part after '-p'), treating the
# base release (no -pN suffix) as 0, then take the maximum integer value.
#   "5.4.0"    -> 0
#   "5.4.0-p1" -> 1
#   "5.4.0-p3" -> 3
- name: Determine the latest patch number
  set_fact:
    _latest_patch_number: >-
      {{
        _patch_images
        | map(attribute='name')
        | map('regex_replace', '^.*:', '')
        | map('regex_replace', '^[^-]+-p', '')
        | map('regex_replace', '^[^-]+$', '0')
        | map('int')
        | max
      }}

- set_fact:
    _p_cp4d_patch_id: "{{ _latest_patch_number }}"

- name: Show latest patch ID
  debug:
    msg: "Latest patch ID: {{ _p_cp4d_patch_id }}"
