---
- include_role:
    name: cp4d-variables

- set_fact:
    _from_oci: True
    
- set_fact:
    _from_oci: False
  when: _cp_alt_repo_used | default(False)

- name: Delete offline directory
  file:
    path: /tmp/work/offline
    state: absent

- ansible.builtin.stat:
    path: "{{ status_dir }}/work/offline"
  register: _status_offline_dir

- debug:
    var: _from_oci

- name: Copy case files from {{ status_dir }}/work/offline to /tmp/work/offline
  copy:
    src: "{{ status_dir }}/work/offline"
    dest: /tmp/work/
    remote_src: True
  when: _status_offline_dir.stat.exists

# Determine oci_location for downloading cases
# - Source registry and not air-gapped --> Entitled registry
# - Source registry and air-gapped --> Portable registry
# - Target registry and image_registry_name specified --> Private registry
# - Target registry and image_registry_name not specified --> Entitled registry
- set_fact:
    _oci_location: ''

- set_fact:
    _oci_location: 'icr.io/cpopen'
  when:
  - _from_oci | bool
  - _p_registry_source_target == 'source'
  - not cpd_airgap | bool

- set_fact:
    _oci_location: '127.0.0.1:12443/cpopen'
  when:
  - _from_oci | bool
  - _p_registry_source_target == 'source'
  - cpd_airgap | bool

- set_fact:
    _oci_location: 'icr.io/cpopen'
  when:
  - _from_oci | bool
  - _p_registry_source_target == 'target'
  - _p_current_cp4d_cluster.image_registry_name | default('') == ''

- block:
  - name: Authenticate to the private registry if specified
    include_role:
      name: cp4d-login-private-registry
  - set_fact:
      _oci_location: '{{ _registry_full_path }}/cpopen'
  when:
  - _from_oci | bool
  - _p_registry_source_target == 'target'
  - _p_current_cp4d_cluster.image_registry_name | default('') != ''

- set_fact:
    _p_cp4d_patch_id: "{{ _p_current_cp4d_cluster.cp4d_patch_id | default('') }}"

- include_tasks: cp4d-get-latest-patch-id.yml
  when: _p_cp4d_patch_id == 'latest'

# Get preview of case-download to ensure the patch files are downloaded when --dry-run was selected
- block:
  - set_fact:
      _case_download_command: "{{ lookup('template', 'case-download.j2') }}"
    vars:
      _p_preview: True
  - name: Run preview of download case files to obtain patch files
    shell: |
      {{ _case_download_command }}
    failed_when: False
    environment:
      OLM_UTILS_IMAGE: "{{ _olm_utils_image_full }}"

  rescue:

  - fail:
      msg: Failure when downloading case files through OCI in air-gapped mode. Cannot revert to GitHub download.
    when: cpd_airgap | bool

  - set_fact:
      _from_oci: False

  - set_fact:
      _case_download_command: "{{ lookup('template', 'case-download.j2') }}"
  - name: Run preview of download case files to obtain patch files after failure from OCI download
    shell: |
      {{ _case_download_command }}
    failed_when: False
    environment:
      OLM_UTILS_IMAGE: "{{ _olm_utils_image_full }}"
  when: cpd_dry_run | bool
    
- block:
  - name: Generate case-download command to download case files using OCI
    set_fact:
      _case_download_command: "{{ lookup('template', 'case-download.j2') }}" 

  - include_role:
      name: run-command
    vars:
      _p_command_description: Download case files
      _p_command: "{{ _case_download_command }}"
      _p_command_log_file: "{{ status_dir }}/log/{{ _p_current_cp4d_cluster.project }}-case-download.log"
      _p_command_environment:
        OLM_UTILS_IMAGE: "{{ _olm_utils_image_full }}"
      _p_cpd_cli_manage: True

  rescue:

  - fail:
      msg: Failure when downloading case files through OCI in air-gapped mode. Cannot revert to GitHub download.
    when: cpd_airgap | bool

  - set_fact:
      _from_oci: False

  - name: Generate case-download command to download case files from GitHub after failure from OCI download
    set_fact:
      _case_download_command: "{{ lookup('template', 'case-download.j2') }}"

  - include_role:
      name: run-command
    vars:
      _p_command_description: Download case files from GitHub
      _p_command: "{{ _case_download_command }}"
      _p_command_log_file: "{{ status_dir }}/log/{{ _p_current_cp4d_cluster.project }}-case-download.log"
      _p_command_environment:
        OLM_UTILS_IMAGE: "{{ _olm_utils_image_full }}"
      _p_cpd_cli_manage: True

- name: Remove {{ status_dir }}/work/offline to remove any previous CASE files
  ansible.builtin.file:
    path: "{{ status_dir }}/work/offline"
    state: absent

- name: Copy case files and patch info to {{ status_dir }}/work
  copy:
    src: "/tmp/work/"
    dest: "{{ status_dir }}/work/"
    remote_src: True

# Update cartridge versions in cartridges_to_install fact
- include_role:
    name: cp4d-variables