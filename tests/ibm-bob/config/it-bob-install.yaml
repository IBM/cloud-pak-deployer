# Integration test configuration, part 2 of 2 (modes dry-run, install, smoke).
# Copied by run_integration_tests.sh to tests/test-run/config/it-bob.yaml before the phase.
#
# Changes for other test cases are made by editing this committed template, for example:
#   - another Bob version:            ibm_bob_version: 2.0.0
#   - another storage or project:     openshift_storage_name / project / operators_project
#   - another model: change core_model to laguna-s-2.1 with quantization fp8
ibm_bob:
- project: ibm-bob
  operators_project: ibm-bob-operators
  openshift_cluster_name: "{{ env_id }}"        # resolved from global_config.env_id
  openshift_storage_name: auto-storage          # storage_name in it-ocp.yaml
  ibm_bob_version: latest
  accept_licenses: true
  state: installed

  # ACME HTTP-01 certificate for Bob routes: disabled, Bob uses its self-signed certificate.
  # To enable it, uncomment the block below and use the Jinja2 variable acme_email as the value
  # (do not write the double curly braces in a comment: the file is rendered as a template).
  # It is read from vault secret ibm_bob_acme_email by run_integration_tests.sh. Store it once:
  #   ./cp-deploy.sh vault set -vs=ibm_bob_acme_email=ops@example.com \
  #     -c $PWD/tests -l $PWD/tests/test-run/status
  # ingress_cert:
  #   acme_email: <acme_email expression>

  # Model serving without GPUs.
  # skip_gpu_check: true lets this run on any cluster regardless of GPU nodes.
  openshift_ai_models:
    core_model: nemotron-3.5-super
    quantization: nvfp4
    gpus_per_core_model: 1
    skip_gpu_check: true
