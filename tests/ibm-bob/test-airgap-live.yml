---
# Integration test: full air-gapped flow.
#
# Run by run_integration_tests.sh when IBM_BOB_IT_MODE=airgap.
# Variables come from it-vars.json (generated by run_integration_tests.sh).
# The vault has already been seeded by it-seed-vault.yml, including:
#   ibm_cp_entitlement_key       – IBM entitled registry key (for mirroring)
#   image-registry-<name>        – private registry credentials
#
# Steps:
#   1. Mirror entitled registry → local filesystem (entitled-to-portable).
#   2. Mirror local filesystem → private registry (portable-to-private).
#   3. Run ibm-bob-cluster (cpd_airgap=true): airgap-apply + install.
#   4. Stage 80 smoke tests to confirm Bob is Ready with private registry images.

- name: "Air-gapped step 1/2: mirror IBM Bob images to local filesystem (entitled-to-portable)"
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ status_dir }}/openshift/kubeconfig"
  tasks:
    - name: Run ibm-bob-mirror-images (entitled-to-portable)
      include_role:
        name: ibm-bob-mirror-images
      vars:
        _p_mirror_motion: entitled-to-portable

- name: "Air-gapped step 2/2: upload images from local filesystem to private registry (portable-to-private)"
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ status_dir }}/openshift/kubeconfig"
  tasks:
    - name: Run ibm-bob-mirror-images (portable-to-private)
      include_role:
        name: ibm-bob-mirror-images
      vars:
        _p_mirror_motion: portable-to-private

- name: "Air-gapped install: deploy IBM Bob using images from private registry"
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ status_dir }}/openshift/kubeconfig"
  tasks:
    - name: Run ibm-bob-cluster (cpd_airgap=true)
      include_role:
        name: ibm-bob-cluster

- name: "Air-gapped smoke test: verify Bob is Ready and images are from private registry"
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ status_dir }}/openshift/kubeconfig"
  tasks:
    - name: Start with an empty info file
      file:
        path: "{{ status_dir }}/cloud-paks/cloud-pak-deployer-info.txt"
        state: absent

    - name: Run ibm-bob-cluster-smoke-tests
      include_role:
        name: ibm-bob-cluster-smoke-tests
