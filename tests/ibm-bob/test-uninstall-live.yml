---
# Integration test step: run the ibm-bob-cluster role with state=removed, then
# the stage 80 smoke tests to confirm both namespaces are gone.
# Variables come from it-vars.json (generated by run_integration_tests.sh with
# IBM_BOB_IT_MODE=remove). The kubeconfig has already been seeded by it-seed-vault.yml.
- name: Uninstall IBM Bob on a live OpenShift cluster
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ status_dir }}/openshift/kubeconfig"
  tasks:
    - name: Run ibm-bob-cluster (state=removed)
      include_role:
        name: ibm-bob-cluster

- name: Verify IBM Bob namespaces are gone (stage 80 smoke test)
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ status_dir }}/openshift/kubeconfig"
  tasks:
    - name: Run ibm-bob-cluster-smoke-tests (state=removed)
      include_role:
        name: ibm-bob-cluster-smoke-tests
