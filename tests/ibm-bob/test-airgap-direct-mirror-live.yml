---
# Integration test: air-gapped direct mirror (entitled-to-private).
#
# Mirrors IBM Bob images straight from cp.icr.io to the private registry
# in a single step (bobctl mirror-images) without touching the local filesystem.
# Equivalent to running the deployer download playbook with CPD_SKIP_PORTABLE_REGISTRY=true.
#
# Run by run_integration_tests.sh when IBM_BOB_IT_MODE=airgap-direct.
# Variables come from it-vars.json (generated by run_integration_tests.sh).
# The vault has already been seeded by it-seed-vault.yml, including:
#   ibm_cp_entitlement_key       – IBM entitled registry key (for mirroring)
#   image-registry-<name>        – private registry credentials

- name: "Air-gapped direct mirror: mirror IBM Bob images from entitled registry to private registry"
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ status_dir }}/openshift/kubeconfig"
  tasks:
    - name: Run ibm-bob-mirror-images (entitled-to-private)
      include_role:
        name: ibm-bob-mirror-images
      vars:
        _p_mirror_motion: entitled-to-private
