---
# Integration test: semi-air-gapped flow (direct mirror), run by run_integration_tests.sh in mode
# airgap-semi with it-bob-airgap.yaml as the active Bob configuration and cpd_airgap=true.
#
# The machine running the deployer can reach both the entitled registry and the private registry,
# so the images go straight from cp.icr.io to the private registry (entitled-to-private) without a
# portable directory in between. The cluster itself still pulls from the private registry only.
#
# Vault secrets used (see tests/README.md):
#   ibm_cp_entitlement_key       IBM entitled registry key (for mirroring)
#   image-registry-<name>        private registry credentials
#
# Steps:
#   1. Download the model weights of openshift_ai_models into the status directory.
#   2. Mirror entitled registry -> private registry (entitled-to-private): the bobctl images and
#      the vLLM serving image.
#   3. Run ibm-bob-cluster (cpd_airgap=true): airgap-apply + install.
#   4. Stage 80 smoke tests to confirm Bob is Ready with private registry images.
- name: Semi-air-gapped IBM Bob direct mirroring, install and smoke test
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ status_dir }}/openshift/kubeconfig"
  tasks:
    - name: Initialize the deployer configuration and vault
      include_tasks: "{{ playbook_dir }}/../../lib/it-init.yml"

    - name: Download IBM Bob model weights
      include_role:
        name: ibm-bob-mirror-images
      vars:
        _p_models_only: true
        _p_mirror_motion: entitled-to-private
        current_ibm_bob_cluster: "{{ _p_current_ibm_bob_cluster }}"
      loop: "{{ all_config.ibm_bob | default([]) | selectattr('openshift_ai_models', 'defined') | list }}"
      loop_control:
        loop_var: _p_current_ibm_bob_cluster

    - name: Mirror IBM Bob images (entitled-to-private)
      include_role:
        name: ibm-bob-mirror-images
      vars:
        _p_mirror_motion: entitled-to-private
        current_ibm_bob_cluster: "{{ _p_current_ibm_bob_cluster }}"
      loop: "{{ all_config.ibm_bob | default([]) | selectattr('image_registry_name', 'defined') | list }}"
      loop_control:
        loop_var: _p_current_ibm_bob_cluster

    - name: Run ibm-bob-cluster (cpd_airgap=true)
      include_role:
        name: ibm-bob-cluster
      loop: "{{ all_config.ibm_bob | default([]) }}"
      loop_control:
        loop_var: current_ibm_bob_cluster

    - name: Start with an empty info file
      file:
        path: "{{ status_dir }}/cloud-paks/cloud-pak-deployer-info.txt"
        state: absent

    - name: Ensure the cloud-paks directory exists
      file:
        path: "{{ status_dir }}/cloud-paks"
        state: directory

    - name: Run ibm-bob-cluster-smoke-tests
      include_role:
        name: ibm-bob-cluster-smoke-tests
      loop: "{{ all_config.ibm_bob | default([]) }}"
      loop_control:
        loop_var: current_ibm_bob_cluster
