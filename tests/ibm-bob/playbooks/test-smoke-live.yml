---
# Integration test step: run ibm-bob-cluster-smoke-tests (and ibm-bob-cluster-show) against an
# installed Bob. The configuration is the tests/test-run/config copy made by run_integration_tests.sh.
- name: Test ibm-bob-cluster-smoke-tests and ibm-bob-cluster-show
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ status_dir }}/openshift/kubeconfig"
  tasks:
    - name: Initialize the deployer configuration and vault
      include_tasks: "{{ playbook_dir }}/../../lib/it-init.yml"

    # In a full deployer run the kubeconfig is written by the login in an earlier stage.
    - name: Login to the OpenShift cluster
      include_role:
        name: openshift-login
      vars:
        _p_openshift_cluster_name: "{{ all_config.ibm_bob[0].openshift_cluster_name }}"

    - name: Start with an empty info file
      file:
        path: "{{ status_dir }}/cloud-paks/cloud-pak-deployer-info.txt"
        state: absent

    - name: Ensure the cloud-paks directory exists
      file:
        path: "{{ status_dir }}/cloud-paks"
        state: directory

    - name: Run ibm-bob-cluster-smoke-tests
      include_role:
        name: ibm-bob-cluster-smoke-tests
      loop: "{{ all_config.ibm_bob | default([]) }}"
      loop_control:
        loop_var: current_ibm_bob_cluster
