---
# Integration test step: run the ibm-bob-cluster role for every ibm_bob object in the configuration
# (prerequisites, config.yaml rendering and, unless cpd_dry_run is true, the install).
# The configuration is the tests/test-run/config copy made by run_integration_tests.sh.
- name: Test ibm-bob-cluster against a live OpenShift cluster
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ status_dir }}/openshift/kubeconfig"
  tasks:
    - name: Initialize the deployer configuration and vault
      include_tasks: "{{ playbook_dir }}/../../lib/it-init.yml"

    - name: Run ibm-bob-cluster
      include_role:
        name: ibm-bob-cluster
      loop: "{{ all_config.ibm_bob | default([]) }}"
      loop_control:
        loop_var: current_ibm_bob_cluster
