---
# Integration test step: run the ibm-bob-cluster role with state=removed, then
# the stage 80 smoke tests to confirm both namespaces are gone.
# The configuration is the tests/test-run/config copy made by run_integration_tests.sh
# (it-bob-remove.yaml); confirm_destroy is passed as an extra variable by the harness.
- name: Uninstall IBM Bob on a live OpenShift cluster
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ status_dir }}/openshift/kubeconfig"
  tasks:
    - name: Initialize the deployer configuration and vault
      include_tasks: "{{ playbook_dir }}/../../lib/it-init.yml"

    - name: Run ibm-bob-cluster (state=removed)
      include_role:
        name: ibm-bob-cluster
      loop: "{{ all_config.ibm_bob | default([]) }}"
      loop_control:
        loop_var: current_ibm_bob_cluster

    - name: Run ibm-bob-cluster-smoke-tests (state=removed)
      include_role:
        name: ibm-bob-cluster-smoke-tests
      loop: "{{ all_config.ibm_bob | default([]) }}"
      loop_control:
        loop_var: current_ibm_bob_cluster
      when: not (cpd_dry_run | default(false) | bool)
