---
# Integration test: live assertions against the cluster, called by run_integration_tests.sh.
#
#   -e it_assert_phase=install   Bob version and cert-manager certificate for IBM Bob routes
#   -e it_assert_phase=upgrade   Bob upgraded in place to the configured version, Degraded=False at the current generation,
#                                obsolete cluster role and binding removed
#   -e it_assert_phase=airgap    all containers in the Bob and operators namespaces use the private registry
#   -e it_assert_phase=remove    namespaces and PVCs are gone
#   -e it_assert_phase=snapshot  save the state of the Bob installation, before a dry run
#   -e it_assert_phase=dry-run          after deployer apply --dry-run of the install configuration:
#   -e it_assert_phase=dry-run-upgrade  after deployer apply --dry-run of the upgrade configuration:
#   -e it_assert_phase=dry-run-remove   after deployer apply --dry-run of the removal configuration:
#                                the planned commands in deployer-activities.log, no secrets in the log,
#                                and the state of the cluster and the vault is the same as in the snapshot
#
# The configuration is the tests/test-run/config copy made by run_integration_tests.sh.
- name: Assert the state of IBM Bob on a live OpenShift cluster
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ status_dir }}/openshift/kubeconfig"
  tasks:
    - name: Check the assertion phase
      assert:
        that: >-
          it_assert_phase | default('') in ['install', 'upgrade', 'airgap', 'remove', 'snapshot',
          'dry-run', 'dry-run-upgrade', 'dry-run-remove']
        fail_msg: >-
          Specify -e it_assert_phase=install, upgrade, airgap, remove, snapshot, dry-run,
          dry-run-upgrade or dry-run-remove
        quiet: true

    - name: Initialize the deployer configuration and vault
      include_tasks: "{{ playbook_dir }}/../../lib/it-init.yml"

    - name: Login to the OpenShift cluster
      include_role:
        name: openshift-login
      vars:
        _p_openshift_cluster_name: "{{ all_config.ibm_bob[0].openshift_cluster_name }}"

    - name: Set the IBM Bob projects
      set_fact:
        _it_bob: "{{ all_config.ibm_bob[0] }}"
        _it_bob_project: "{{ all_config.ibm_bob[0].project }}"
        _it_bob_operators_project: "{{ all_config.ibm_bob[0].operators_project | default(all_config.ibm_bob[0].project + '-operators') }}"
        _it_bob_models_project: >-
          {{ (all_config.ibm_bob[0].openshift_ai_models | default({})).project
             | default(all_config.ibm_bob[0].project + '-models') }}

    # ---- Version of the installed Bob ------------------------------------------
    # spec.version of the Bob CR is the source the deployer uses to detect an upgrade
    # (check-bob-upgrade.yml). A latest in the configuration is not checked.
    - name: Assert the version of IBM Bob
      when: it_assert_phase in ['install', 'upgrade']
      block:
        # latest is resolved by the deployer to the highest x.y.z, and its bundle is then in the
        # status directory (downloads/ibm-bob/<version>), so the highest directory is the expected version.
        - name: Find the downloaded IBM Bob versions
          find:
            paths: "{{ status_dir }}/downloads/ibm-bob"
            file_type: directory
            patterns: '^[0-9]+\.[0-9]+\.[0-9]+$'
            use_regex: true
          register: _it_version_dirs
          when: _it_bob.ibm_bob_version | default('latest') == 'latest'

        - name: Set the expected version of IBM Bob
          set_fact:
            _it_expected_version: >-
              {{ (_it_version_dirs.files | map(attribute='path') | map('basename')
                  | community.general.version_sort | last)
                 if _it_bob.ibm_bob_version | default('latest') == 'latest'
                 else (_it_bob.ibm_bob_version | string) }}

        - name: Get the Bob custom resource bob-cr
          kubernetes.core.k8s_info:
            api_version: bob.ibm.com/v1beta1
            kind: Bob
            name: bob-cr
            namespace: "{{ _it_bob_project }}"
          register: _it_version_cr

        - name: Assert that spec.version of bob-cr is the configured version
          assert:
            that:
              - _it_version_cr.resources | length == 1
              - (_it_version_cr.resources[0].spec.version | default('') | string) == _it_expected_version
            fail_msg: >-
              spec.version of bob-cr in {{ _it_bob_project }} is
              '{{ (_it_version_cr.resources | first | default({})).spec.version | default('not set') }}',
              expected {{ _it_expected_version }} (ibm_bob_version: {{ _it_bob.ibm_bob_version | default('latest') }}).
            quiet: true

    # ---- Upgrade ---------------------------------------------------------------
    # Live confirmation of what the deployer assumes after bobctl upgrade (see wait-for-ready.yml):
    # the CR is Available for the current generation, not Degraded, and the instance was upgraded in
    # place (Keycloak admin secret, model gateway objects), with the obsolete cluster role removed.
    - name: Assert that IBM Bob was upgraded
      when: it_assert_phase == 'upgrade'
      block:
        - name: Get the Bob custom resource bob-cr
          kubernetes.core.k8s_info:
            api_version: bob.ibm.com/v1beta1
            kind: Bob
            name: bob-cr
            namespace: "{{ _it_bob_project }}"
          register: _it_up_cr

        # Observed on a live 2.0.0 to 2.0.1 upgrade: Available has no observedGeneration and
        # Progressing keeps an old one; only Degraded carries the current generation.
        - name: Set the conditions of the Bob custom resource
          vars:
            _cr: "{{ _it_up_cr.resources | first | default({}) }}"
            _conditions: "{{ (_cr.status | default({})).conditions | default([]) }}"
          set_fact:
            _it_up_generation: "{{ (_cr.metadata | default({})).generation | default(-1) }}"
            _it_up_available: "{{ _conditions | selectattr('type', 'equalto', 'Available') | list }}"
            _it_up_degraded: "{{ _conditions | selectattr('type', 'equalto', 'Degraded') | list }}"

        - name: Assert that the Bob CR is Available and not Degraded for its current generation
          assert:
            that:
              - _it_up_cr.resources | length == 1
              - _it_up_available | selectattr('status', 'equalto', 'True') | list | length == 1
              - _it_up_degraded | length == 1
              - _it_up_degraded[0].status == 'False'
              - _it_up_degraded[0].observedGeneration is defined
              - _it_up_degraded[0].observedGeneration | int == _it_up_generation | int
            fail_msg: >-
              bob-cr in {{ _it_bob_project }} is not Available, or Degraded was not False at generation
              {{ _it_up_generation }}. Available: {{ _it_up_available }} Degraded: {{ _it_up_degraded }}
            quiet: true

        - name: Get the operator deployment and the pods of the Bob instance
          kubernetes.core.k8s_info:
            api_version: "{{ item.api_version }}"
            kind: "{{ item.kind }}"
            namespace: "{{ item.namespace }}"
          register: _it_up_workloads
          loop:
            - { api_version: apps/v1, kind: Deployment, namespace: "{{ _it_bob_operators_project }}" }
            - { api_version: v1, kind: Pod, namespace: "{{ _it_bob_project }}" }

        - name: Find the pods that are not running
          set_fact:
            _it_up_bad_pods: >-
              {{ _it_up_workloads.results[1].resources
                 | rejectattr('status.phase', 'in', ['Running', 'Succeeded'])
                 | map(attribute='metadata.name') | list }}
            _it_up_operator: >-
              {{ _it_up_workloads.results[0].resources
                 | selectattr('metadata.name', 'equalto', 'ibm-bob-operator') | list }}

        - name: Assert that the operator and the instance pods are ready
          assert:
            that:
              - _it_up_operator | length == 1
              - (_it_up_operator[0].status.availableReplicas | default(0)) >= 1
              - _it_up_workloads.results[1].resources | length > 0
              - _it_up_bad_pods | length == 0
            fail_msg: >-
              The operator deployment ibm-bob-operator in {{ _it_bob_operators_project }} is not available, or
              pods in {{ _it_bob_project }} are not Running or Succeeded: {{ _it_up_bad_pods }}
            quiet: true

        - name: Get the Keycloak admin secret and the model gateway objects
          kubernetes.core.k8s_info:
            api_version: "{{ item.api_version }}"
            kind: "{{ item.kind }}"
            name: "{{ item.name }}"
            namespace: "{{ item.namespace }}"
          register: _it_up_kept
          loop:
            - { api_version: v1, kind: Secret, name: bob-keycloak-initial-admin, namespace: "{{ _it_bob_project }}" }
            - { api_version: serving.kserve.io/v1beta1, kind: InferenceService, name: ibm-bob-core-model, namespace: "{{ _it_bob_models_project }}" }
            - { api_version: serving.kserve.io/v1beta1, kind: InferenceService, name: ibm-bob-guardrail-model, namespace: "{{ _it_bob_models_project }}" }
          loop_control:
            label: "{{ item.kind }} {{ item.name }}"
          no_log: true

        - name: Assert that the Keycloak admin secret was kept (the instance was not reinstalled)
          assert:
            that: _it_up_kept.results[0].resources | length == 1
            fail_msg: "Secret bob-keycloak-initial-admin in {{ _it_bob_project }} is missing after the upgrade."
            quiet: true

        - name: Assert that the InferenceServices were kept
          assert:
            that:
              - _it_up_kept.results[1].resources | length == 1
              - _it_up_kept.results[2].resources | length == 1
            fail_msg: "InferenceService ibm-bob-core-model or ibm-bob-guardrail-model in {{ _it_bob_models_project }} is missing after the upgrade."
            quiet: true
          when: (_it_bob.openshift_ai_models | default({})) != {}

        - name: Get the obsolete cluster role and cluster role binding
          kubernetes.core.k8s_info:
            api_version: rbac.authorization.k8s.io/v1
            kind: "{{ item.kind }}"
            name: "{{ item.name }}"
          register: _it_up_rbac
          loop:
            - { kind: ClusterRole, name: "ibm-bob-role-{{ _it_bob_operators_project }}" }
            - { kind: ClusterRoleBinding, name: "ibm-bob-rolebinding-{{ _it_bob_operators_project }}" }
          loop_control:
            label: "{{ item.kind }} {{ item.name }}"

        - name: Assert that the obsolete cluster role and binding are gone
          assert:
            that: _it_up_rbac.results | map(attribute='resources') | map('length') | sum == 0
            fail_msg: >-
              ClusterRole ibm-bob-role-{{ _it_bob_operators_project }} or ClusterRoleBinding
              ibm-bob-rolebinding-{{ _it_bob_operators_project }} still exists after the upgrade.
            quiet: true

    # ---- Dry run: snapshot and comparison --------------------------------------
    # The snapshot is taken before deployer apply --dry-run (phase snapshot) and compared after it.
    - name: Save the state of IBM Bob before a dry run
      when: it_assert_phase == 'snapshot'
      block:
        - name: Collect the state of IBM Bob
          include_tasks: "{{ playbook_dir }}/bob-state.yml"

        - name: Write the snapshot
          copy:
            content: "{{ _it_state | to_nice_json }}"
            dest: "{{ status_dir }}/ibm-bob-it-snapshot.json"
            mode: '0644'

    - name: Assert the result of a dry run
      when: it_assert_phase in ['dry-run', 'dry-run-upgrade', 'dry-run-remove']
      block:
        - name: Set the names used in the planned commands
          set_fact:
            _it_dr_models: "{{ (_it_bob.openshift_ai_models | default({})) != {} }}"
            _it_dr_keep_weights: "{{ not (_it_bob.remove_model_weights | default(true) | bool) }}"

        # Secrets that must never be written to the log: the entitlement key (when known; the dry
        # run itself does not need it), plus the field names of the pull secret and registry credentials.
        - name: Read the entitlement key from the vault file (empty when not set)
          shell: >-
            grep "^ibm_cp_entitlement_key=" "{{ status_dir }}/vault/{{ environment_name }}" | cut -d= -f2- | base64 -d || true
          register: _it_dr_vault_entitlement_key
          changed_when: false
          no_log: true

        - name: List the secrets and secret fields that must not be logged
          set_fact:
            _it_log_secrets: >-
              {{ ([lookup('ansible.builtin.env', 'CP_ENTITLEMENT_KEY'), _it_dr_vault_entitlement_key.stdout | default('')]
                  | select('truthy') | list | unique) }}
            _it_log_forbid_secrets: ['registryPassword', '.dockerconfigjson']
          no_log: true

        # Order of the planned install activities (see main.yml): OpenShift AI objects, then
        # bobctl generate-cluster-resources, oc apply, bobctl install.
        - name: Set the planned activities of the install dry run
          set_fact:
            _it_log_expect: >-
              {{ (['Create PVC ibm-bob-core-model', 'Create InferenceService ibm-bob-core-model'] if _it_dr_models else [])
                 + ['bobctl generate-cluster-resources',
                    'cluster-resources.yaml --force-conflicts --server-side',
                    'bobctl install --accept-license']
                 + (['--model-config'] if _it_dr_models else []) }}
            _it_log_forbid: ['bobctl upgrade', 'bobctl update-model-config', 'oc delete clusterrole']
          when: it_assert_phase == 'dry-run'

        - name: Set the planned activities of the upgrade dry run
          set_fact:
            _it_log_expect: >-
              {{ ['bobctl generate-cluster-resources',
                  'cluster-resources.yaml --force-conflicts --server-side',
                  'oc delete clusterrole ibm-bob-role-' ~ _it_bob_operators_project,
                  'oc delete clusterrolebinding ibm-bob-rolebinding-' ~ _it_bob_operators_project,
                  'bobctl upgrade']
                 + (['bobctl update-model-config', '--model-config'] if _it_dr_models else []) }}
            _it_log_forbid: ['bobctl install']
          when: it_assert_phase == 'dry-run-upgrade'

        # Same order as uninstall-bob.yml.
        - name: Set the planned activities of the removal dry run
          set_fact:
            _it_log_expect: >-
              {{ ['oc delete bob bob-cr -n ' ~ _it_bob_project,
                  'helm uninstall ibm-bob --namespace ' ~ _it_bob_project,
                  'oc delete namespace ' ~ _it_bob_project ~ ' ',
                  'oc delete namespace ' ~ _it_bob_operators_project ~ ' ']
                 + (['oc delete inferenceservice.serving.kserve.io ibm-bob-core-model -n ' ~ _it_bob_models_project,
                     'oc delete servingruntime.serving.kserve.io ibm-bob-core-vllm -n ' ~ _it_bob_models_project] if _it_dr_models else [])
                 + (['oc delete job ibm-bob-core-model-download -n ' ~ _it_bob_models_project,
                     'oc delete pvc ibm-bob-core-model -n ' ~ _it_bob_models_project,
                     'oc delete namespace ' ~ _it_bob_models_project ~ ' '] if (_it_dr_models and not _it_dr_keep_weights) else [])
                 + ['cluster-resources.yaml --ignore-not-found',
                    'Remove Keycloak admin vault key for ' ~ _it_bob_project] }}
            _it_log_forbid: >-
              {{ ['bobctl install', 'bobctl upgrade']
                 + (['oc delete job', 'oc delete pvc', 'oc delete namespace ' ~ _it_bob_models_project] if (_it_dr_models and _it_dr_keep_weights) else []) }}
          when: it_assert_phase == 'dry-run-remove'

        - name: Assert the planned activities in deployer-activities.log
          include_tasks: "{{ playbook_dir }}/assert-activity-log.yml"

        - name: Read the snapshot taken before the dry run
          slurp:
            src: "{{ status_dir }}/ibm-bob-it-snapshot.json"
          register: _it_snapshot_file

        - name: Collect the state of IBM Bob after the dry run
          include_tasks: "{{ playbook_dir }}/bob-state.yml"

        - name: Assert that the dry run changed nothing on the cluster or in the vault
          assert:
            that: _it_state == (_it_snapshot_file.content | b64decode | from_json)
            fail_msg: >-
              The dry run changed the state of IBM Bob.
              Before: {{ _it_snapshot_file.content | b64decode | from_json }}
              After: {{ _it_state }}
            quiet: true

        - name: Assert that Bob is still fully installed after the removal dry run
          assert:
            that:
              - _it_state.bob_cr_exists
              - _it_state.namespaces_present is superset([_it_bob_project, _it_bob_operators_project])
              - _it_state.helm_release_secrets | length > 0
              - _it_state.keycloak_vault_key_present
              - not _it_dr_models or (_it_state.model_pvcs | length > 0 and _it_state.inference_services | length > 0)
            fail_msg: >-
              dry-run-remove needs an installed Bob, and nothing may be removed by it. State: {{ _it_state }}
            quiet: true
          when: it_assert_phase == 'dry-run-remove'

    # ---- Certificate mode ------------------------------------------------------
    # Branch on whether ingress_cert is configured in the deployer config:
    #   - ingress_cert set (acme_email or cluster_issuer): assert Certificate Ready,
    #     Bob CR uses bob-cluster-ingress-tls, access report confirms cert provisioned.
    #   - ingress_cert not set (default self-signed): assert Bob CR uses bob-external-tls
    #     and the access report says self-signed.
    - name: Assert the certificate configuration of IBM Bob
      when: it_assert_phase == 'install'
      block:
        - name: Determine certificate mode from deployer config
          set_fact:
            _it_ingress_cert_configured: "{{ (_it_bob.ingress_cert | default({})) != {} }}"

        # ---- ingress_cert configured: cert-manager issued cert ----------------
        - name: Assert cert-manager certificate was issued and registered
          when: _it_ingress_cert_configured
          block:
            - name: Get Certificate bob-cluster-ingress-tls
              kubernetes.core.k8s_info:
                api_version: cert-manager.io/v1
                kind: Certificate
                name: bob-cluster-ingress-tls
                namespace: "{{ _it_bob_project }}"
              register: _it_cert_cr

            - name: Assert Certificate exists and is Ready
              assert:
                that:
                  - _it_cert_cr.resources | length == 1
                  - (_it_cert_cr.resources[0].status.conditions
                     | selectattr('type', 'equalto', 'Ready')
                     | map(attribute='status') | first | default('False')) == 'True'
                fail_msg: "Certificate bob-cluster-ingress-tls in {{ _it_bob_project }} is missing or not Ready."
                quiet: true

            - name: Get the Bob custom resource bob-cr
              kubernetes.core.k8s_info:
                api_version: bob.ibm.com/v1beta1
                kind: Bob
                name: bob-cr
                namespace: "{{ _it_bob_project }}"
              register: _it_bob_cr

            - name: Assert that the Bob CR uses bob-cluster-ingress-tls
              assert:
                that:
                  - _it_bob_cr.resources | length == 1
                  - _it_bob_cr.resources[0].spec.externalCertificate.secretName | default('') == 'bob-cluster-ingress-tls'
                fail_msg: >-
                  spec.externalCertificate.secretName of bob-cr in {{ _it_bob_project }} is not bob-cluster-ingress-tls.
                quiet: true

            - name: Read the access report
              slurp:
                src: "{{ status_dir }}/cloud-paks/cloud-pak-deployer-info.txt"
              register: _it_info_file

            - name: Assert that the access report mentions the provisioned certificate
              assert:
                that: "'A TLS certificate was issued by cert-manager' in (_it_info_file.content | b64decode)"
                fail_msg: "The access report does not mention the cert-manager issued certificate."
                quiet: true

        # ---- ingress_cert not configured: self-signed -------------------------
        - name: Assert Bob uses default self-signed certificate
          when: not _it_ingress_cert_configured
          block:
            - name: Get the Bob custom resource bob-cr
              kubernetes.core.k8s_info:
                api_version: bob.ibm.com/v1beta1
                kind: Bob
                name: bob-cr
                namespace: "{{ _it_bob_project }}"
              register: _it_bob_cr

            - name: Assert Bob CR uses the default self-signed secret
              assert:
                that:
                  - _it_bob_cr.resources | length == 1
                  - _it_bob_cr.resources[0].spec.externalCertificate.secretName | default('') != 'bob-cluster-ingress-tls'
                fail_msg: >-
                  ingress_cert is not configured but Bob CR is using bob-cluster-ingress-tls.
                  Expected the default self-signed certificate (bob-external-tls).
                quiet: true

            - name: Read the access report
              slurp:
                src: "{{ status_dir }}/cloud-paks/cloud-pak-deployer-info.txt"
              register: _it_info_file

            - name: Assert that the access report shows self-signed certificate in use
              assert:
                that: "'default self-signed certificate is in use' in (_it_info_file.content | b64decode)"
                fail_msg: "The access report does not show 'default self-signed certificate is in use'."
                quiet: true

    # ---- Private registry (air-gapped) -----------------------------------------
    # Every container and init container of every pod in the Bob and operators namespaces
    # must pull its image from the private registry of the ibm_bob entry
    # (image_registry_name -> image_registry.registry_url). The pod spec is checked, not the
    # container status, so pods that have not started yet are covered as well.
    # IBM Usage Metering containers (icr.io/cpopen/) are redirected to the private registry
    # via the cluster-scoped IDMS/ICSP generated by bobctl generate-cluster-resources.
    # The models namespace pods belong to OpenShift AI / KServe and are not checked, except for
    # the vLLM image that the deployer sets explicitly on the two ServingRuntimes.
    - name: Assert that the containers use the private registry
      when: it_assert_phase == 'airgap'
      block:
        - name: Resolve the private registry of the IBM Bob entry
          set_fact:
            _it_registry_entry: >-
              {{ all_config.image_registry | default([])
                 | selectattr('name', 'equalto', _it_bob.image_registry_name | default(''))
                 | first | default({}) }}

        - name: Assert that the private registry is defined
          assert:
            that: (_it_registry_entry.registry_url | default('')) != ''
            fail_msg: >-
              No image_registry entry '{{ _it_bob.image_registry_name | default('') }}' with a registry_url
              was found; the airgap assertions need ibm_bob.image_registry_name.
            quiet: true

        - name: Set the private registry prefix
          set_fact:
            _it_registry_prefix: "{{ _it_registry_entry.registry_url | regex_replace('^https?://', '') | regex_replace('/+$', '') }}"

        - name: Get the pods in the IBM Bob and operators namespaces
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Pod
            namespace: "{{ item }}"
          register: _it_pods
          loop:
            - "{{ _it_bob_project }}"
            - "{{ _it_bob_operators_project }}"

        - name: List the images of all containers and init containers
          set_fact:
            _it_image_rows: |
              {% set ns = namespace(rows=[]) %}
              {% for r in _it_pods.results %}
              {% for p in r.resources %}
              {% for c in (p.spec.initContainers | default([])) + p.spec.containers %}
              {% set ns.rows = ns.rows + [{'namespace': p.metadata.namespace, 'pod': p.metadata.name, 'container': c.name, 'image': c.image}] %}
              {% endfor %}
              {% endfor %}
              {% endfor %}
              {{ ns.rows | to_json }}

        - name: Parse the image list
          set_fact:
            _it_images: "{{ _it_image_rows | from_json }}"

        - name: Find the images that do not come from the private registry
          set_fact:
            _it_foreign_images: >-
              {{ _it_images
                 | rejectattr('image', 'match', (_it_registry_prefix | regex_escape) ~ '/')
                 | rejectattr('image', 'match', '^icr\.io/cpopen/')
                 | list }}

        - name: Show the images checked
          debug:
            msg: "{{ _it_images | length }} containers checked against {{ _it_registry_prefix }}/"

        - name: Assert that the Bob and operator namespaces have containers
          assert:
            that:
              - _it_images | selectattr('namespace', 'equalto', _it_bob_project) | list | length > 0
              - _it_images | selectattr('namespace', 'equalto', _it_bob_operators_project) | list | length > 0
            fail_msg: >-
              No pods found in {{ _it_bob_project }} or {{ _it_bob_operators_project }}; there is nothing to check.
            quiet: true

        - name: Assert that all images come from the private registry
          assert:
            that: _it_foreign_images | length == 0
            fail_msg: >-
              {{ _it_foreign_images | length }} container(s) do not use the private registry
              {{ _it_registry_prefix }}/ :
              {% for i in _it_foreign_images %}
              {{ i.namespace }}/{{ i.pod }} [{{ i.container }}] {{ i.image }};
              {% endfor %}
            quiet: true

        # ---- vLLM image of the ServingRuntimes (models namespace) -------------
        - name: Get the vLLM ServingRuntimes
          kubernetes.core.k8s_info:
            api_version: serving.kserve.io/v1alpha1
            kind: ServingRuntime
            namespace: "{{ _it_bob_models_project }}"
          register: _it_serving_runtimes
          when: (_it_bob.openshift_ai_models | default({})) != {}

        - name: List the vLLM images
          set_fact:
            _it_vllm_images: >-
              {{ _it_serving_runtimes.resources | default([])
                 | selectattr('metadata.name', 'in', ['ibm-bob-core-vllm', 'ibm-bob-guardrail-vllm'])
                 | map(attribute='spec.containers') | flatten
                 | map(attribute='image') | list }}
          when: (_it_bob.openshift_ai_models | default({})) != {}

        - name: Assert that the vLLM images come from the private registry
          assert:
            that:
              - _it_vllm_images | length == 2
              - _it_vllm_images | reject('match', (_it_registry_prefix | regex_escape) ~ '/') | list | length == 0
            fail_msg: >-
              The ServingRuntimes ibm-bob-core-vllm and ibm-bob-guardrail-vllm in {{ _it_bob_models_project }}
              must both use an image from {{ _it_registry_prefix }}/. Found: {{ _it_vllm_images }}
            quiet: true
          when: (_it_bob.openshift_ai_models | default({})) != {}

    # ---- Removal ---------------------------------------------------------------
    - name: Assert that IBM Bob was removed
      when: it_assert_phase == 'remove'
      block:
        - name: Get the IBM Bob namespaces
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Namespace
            name: "{{ item }}"
          register: _it_namespaces
          loop:
            - "{{ _it_bob_project }}"
            - "{{ _it_bob_operators_project }}"
            - "{{ _it_bob_models_project }}"

        - name: Get the PVCs in the models namespace
          kubernetes.core.k8s_info:
            api_version: v1
            kind: PersistentVolumeClaim
            namespace: "{{ _it_bob_models_project }}"
          register: _it_model_pvcs

        - name: Assert that the namespaces and the model PVCs are absent
          assert:
            that:
              - _it_namespaces.results | map(attribute='resources') | map('length') | sum == 0
              - _it_model_pvcs.resources | default([]) | length == 0
            fail_msg: >-
              IBM Bob was not fully removed. Namespaces {{ _it_bob_project }}, {{ _it_bob_operators_project }}
              and {{ _it_bob_models_project }} and the model PVCs must be absent
              (set remove_model_weights: false to keep the models namespace on purpose).
            quiet: true
