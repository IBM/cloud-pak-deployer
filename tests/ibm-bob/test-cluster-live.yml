---
# Integration test step 2: run the ibm-bob-cluster role (prerequisites, config.yaml rendering and,
# unless cpd_dry_run is true, the install). All variables come from it-vars.json, which is
# generated by run_integration_tests.sh.
- name: Test ibm-bob-cluster against a live OpenShift cluster
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ status_dir }}/openshift/kubeconfig"
  tasks:
    - name: Run ibm-bob-cluster
      include_role:
        name: ibm-bob-cluster
