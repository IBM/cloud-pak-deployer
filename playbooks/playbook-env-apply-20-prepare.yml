---
- name: 20 - Prepare
  hosts: localhost
  connection: local
  become: True
  gather_facts: False

  vars:
    ansible_callback_diy_runner_on_skipped_msg: ""
    ansible_callback_diy_runner_on_ok_msg: ""
    ansible_callback_diy_playbook_on_include_msg: ""

  pre_tasks:

  - name: Mark installation progress step as started
    include_role:
      name: installation-progress
    vars:
      _p_progress_action: start
      _p_progress_step: "20 - Prepare"

  tasks:

  - stat:
      path: "{{ config_dir }}/assets/deployer-hook-pre-20-prepare.yml"
    register: _hook_pre_file

  - include_tasks: "{{ config_dir }}/assets/deployer-hook-pre-20-prepare.yml"
    when: _hook_pre_file.stat.exists

  - name: Prepare deployer environment
    include_role:
      name: prepare-deployer

  post_tasks:

  - name: Mark installation progress step as completed
    include_role:
      name: installation-progress
    vars:
      _p_progress_action: complete
      _p_progress_step: "20 - Prepare"
